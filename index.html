 blurred vision and photophobia. There is circumcorneal injection and a small, irregular pupil. There is no discharge.\nWhat is the most likely diagnosis?","o":["Bacterial conjunctivitis","Episcleritis","Necrotising scleritis","Acute anterior uveitis","Acute angle-closure glaucoma"],"a":3,"e":"Acute anterior uveitis (iritis) is the commonest extra-articular manifestation of ankylosing spondylitis and is strongly HLA-B27 associated. Pain, photophobia, ciliary flush and a small irregular pupil (posterior synechiae) are characteristic. It needs same-day ophthalmology review and topical steroids with mydriatics.","w":["Wrong - conjunctivitis is gritty with discharge, no photophobia and a normal pupil.","Wrong - episcleritis is mildly uncomfortable with sectoral redness and normal vision and pupil.","Wrong - scleritis is a deep boring pain, more typical of RA than AS, without a small irregular pupil.","Correct - painful red eye, photophobia, ciliary flush and small irregular pupil in an HLA-B27 patient.","Wrong - angle closure gives a fixed mid-dilated pupil, hazy cornea and very high pressure, typically in older hypermetropes."]},{"t":"AS","stem":"A 26-year-old man with axial spondyloarthritis has persistent nocturnal back pain and morning stiffness. He has completed 4 weeks each of two different full-dose NSAIDs and attends physiotherapy. CRP remains raised and disease activity scores are high. There is no peripheral arthritis.\nWhat is the most appropriate next drug treatment?","o":["Methotrexate","Long-term oral prednisolone","Sulfasalazine","Hydroxychloroquine","Adalimumab"],"a":4,"e":"NSAIDs are first line in AS. When at least two NSAIDs fail and disease remains active, a TNF inhibitor (e.g. adalimumab, etanercept, infliximab) is indicated. Conventional DMARDs do not improve axial disease, and systemic steroids are not recommended long term.","w":["Wrong - methotrexate has no proven benefit for axial spondylitis.","Wrong - long-term systemic steroids are ineffective for axial AS and cause osteoporosis.","Wrong - sulfasalazine may help peripheral arthritis only, not axial symptoms.","Wrong - hydroxychloroquine has no role in AS.","Correct - TNF inhibitor after failure of two NSAIDs in active axial disease."]},{"t":"AS","stem":"A 22-year-old man has 1 year of inflammatory back pain and is HLA-B27 positive. His lumbar spine radiographs are normal.\nWhich radiographic finding is typically the EARLIEST to appear in his condition?","o":["Ossification of interspinous ligaments","Bridging marginal syndesmophytes","Bilateral sacroiliitis","Bamboo spine","Squaring of vertebral bodies"],"a":2,"e":"Ankylosing spondylitis begins at the sacroiliac joints: bilateral symmetrical sacroiliitis (sclerosis, erosions, then fusion) is the first radiographic sign, so an AP pelvis is the key early film. Squaring, syndesmophytes and bamboo spine follow years later; MRI shows SIJ inflammation before radiographs change.","w":["Wrong - ligament ossification (dagger sign) is a late feature.","Wrong - bridging syndesmophytes develop later in the disease course.","Correct - sacroiliac joints are affected first; their films change before the lumbar spine.","Wrong - bamboo spine is a late, end-stage finding.","Wrong - squaring follows enthesitis at vertebral corners, after sacroiliitis."]},{"t":"AS","stem":"A 55-year-old man with advanced ankylosing spondylitis is listed for elective total hip replacement. He has a fixed cervicothoracic kyphosis with chin-brow-to-vertical angle of 35°, limited mouth opening, chest expansion of 1.5 cm and an early diastolic murmur at the left sternal edge.\nWhat is the most important anaesthetic consideration?","o":["Plan awake fibreoptic intubation","Proceed without further assessment","Neck extension for direct laryngoscopy","Routine rapid-sequence induction","Spinal anaesthesia as first choice"],"a":0,"e":"Fixed cervical flexion and limited mouth opening make direct laryngoscopy very difficult, and forcing extension can fracture the brittle ankylosed spine. Awake fibreoptic intubation is the safe plan. Neuraxial block is often technically impossible due to ossified ligaments; the murmur suggests aortic regurgitation needing echocardiography.","w":["Correct - anticipated difficult airway with a rigid, fracture-prone cervical spine.","Wrong - the murmur (likely aortic regurgitation) and restrictive chest need assessment pre-op.","Wrong - forcing extension risks a cervical fracture and cord injury.","Wrong - standard RSI relies on direct laryngoscopy, likely to fail with a fixed flexed neck.","Wrong - ossified interspinous ligaments often make spinal/epidural impossible."]},{"t":"GOUT","stem":"A 61-year-old man with hypertension on hydrochlorothiazide develops an acutely hot, swollen right knee overnight. Temperature 37.9 °C. Aspirate is cloudy: WCC 22,000/µL (80% neutrophils), Gram stain negative. Polarised microscopy shows needle-shaped crystals that are strongly negatively birefringent.\nWhat is the most likely diagnosis?","o":["Reactive arthritis","Acute gout flare","Flare of osteoarthritis","Acute pseudogout","Septic arthritis"],"a":1,"e":"Needle-shaped, strongly negatively birefringent monosodium urate crystals are 100% specific for gout and are the gold standard for diagnosis. Inflammatory fluid and low-grade fever are common in a gout flare. The thiazide is a precipitating factor. Culture should still be awaited, as infection can coexist.","w":["Wrong - reactive arthritis follows GI/GU infection and has no crystals.","Correct - MSU crystals (needles, negative birefringence) confirm gout.","Wrong - OA fluid is non-inflammatory (WCC < 2000/µL) without crystals.","Wrong - CPPD crystals are rhomboid and weakly positively birefringent.","Wrong - Gram-negative with diagnostic crystals; septic fluid usually WCC > 50,000/µL (culture still sent)."]},{"t":"GOUT","stem":"A 48-year-old man presents with a 2-day exquisitely tender, red, swollen 1st MTP joint after a wedding feast. He declines joint aspiration. Serum uric acid today is 5.9 mg/dL (351 µmol/L). eGFR is normal.\nWhat is the most appropriate approach to confirming the diagnosis?","o":["Exclude gout because urate is normal","Request a radionuclide bone scan now","Send HLA-B27 and rheumatoid factor","Repeat urate ≥ 2 weeks post-flare","Start allopurinol to test the response"],"a":3,"e":"Serum urate may fall to normal during an acute flare, so a normal value does not exclude gout. The Malaysian CPG advises repeating serum uric acid at least 2 weeks after the flare has resolved if suspicion remains high. Crystal identification remains the gold standard, and hyperuricaemia alone never makes the diagnosis.","w":["Wrong - a normal level during a flare does not exclude gout.","Wrong - bone scan is non-specific and not used to diagnose gout.","Wrong - these tests address spondyloarthritis/RA, not this classic podagra.","Correct - urate is unreliable during a flare; repeat ≥ 2 weeks after resolution.","Wrong - ULT is not a diagnostic test and starting it mid-flare without indication is inappropriate."]},{"t":"GOUT","stem":"A 57-year-old man has had three gout flares this year. He has hypertension controlled on hydrochlorothiazide 25 mg daily. eGFR is 75 mL/min/1.73 m². His BP is 138/86 mmHg.\nWhich antihypertensive is the most appropriate replacement for his thiazide?","o":["Furosemide","Atenolol","Losartan","Telmisartan","Perindopril"],"a":2,"e":"Thiazide and loop diuretics, ACE inhibitors, non-losartan ARBs and beta-blockers raise gout risk. Losartan is uricosuric and calcium channel blockers also lower gout risk, so either is preferred in hypertensive patients with gout (Malaysian CPG Gout 2nd ed.).","w":["Wrong - loop diuretics raise serum urate like thiazides.","Wrong - beta-blockers increase the risk of gout.","Correct - losartan has a uricosuric effect and lowers gout risk.","Wrong - non-losartan ARBs increase gout risk; the uricosuric effect is specific to losartan.","Wrong - ACE inhibitors are associated with increased gout risk."]},{"t":"GOUT","stem":"A 52-year-old man started allopurinol 100 mg daily 3 months ago, titrated to 300 mg daily, after recurrent gout. He now presents with an acute flare of the left ankle. He takes no other medication; renal function is normal.\nWhat is the most appropriate management?","o":["Stop allopurinol until the flare settles","Stop allopurinol permanently","Switch allopurinol to febuxostat","Double the allopurinol dose today","Continue allopurinol; add colchicine"],"a":4,"e":"Flares are common in the first months of urate-lowering therapy as crystals dissolve. ULT should not be stopped during a flare, as fluctuating urate prolongs and provokes attacks. Treat the flare with colchicine, NSAID or steroid, and ensure ongoing prophylaxis.","w":["Wrong - stopping ULT during a flare causes urate fluctuation and more flares.","Wrong - early flares are expected on ULT and do not mean treatment failure.","Wrong - febuxostat offers no advantage for a flare and also needs prophylaxis.","Wrong - abrupt dose escalation mid-flare can worsen it; titrate gradually when quiescent.","Correct - keep ULT steady and treat the flare with an anti-inflammatory such as colchicine."]},{"t":"GOUT","stem":"A 72-year-old man presents with an acute gout flare of the right knee. He has CKD stage 4 (eGFR 21 mL/min/1.73 m²), a past bleeding gastric ulcer and takes warfarin for atrial fibrillation. Septic arthritis has been excluded by aspiration and Gram stain.\nWhat is the most appropriate treatment for the flare?","o":["Indomethacin 50 mg three times daily","Oral prednisolone short course","Naproxen 500 mg twice daily","Start allopurinol 300 mg daily","High-dose colchicine regimen"],"a":1,"e":"Flare options are colchicine, NSAIDs or corticosteroids; the choice depends on comorbidity. NSAIDs are contraindicated in severe CKD, peptic ulcer and anticoagulation, and colchicine must be avoided or heavily dose-reduced in severe renal impairment. Short-course oral (or intra-articular) corticosteroid is the safest choice.","w":["Wrong - indomethacin is an NSAID with the same contraindications.","Correct - steroids avoid the renal, GI and bleeding risks of NSAIDs and colchicine toxicity in CKD 4.","Wrong - NSAID with CKD 4, previous bleeding ulcer and warfarin is unsafe.","Wrong - ULT does not treat a flare and should not be started at full dose, especially in CKD.","Wrong - colchicine accumulates in severe CKD, causing toxicity (myopathy, marrow suppression)."]},{"t":"GOUT","stem":"A 50-year-old man has had four gout flares in a year and has a tophus on the left olecranon. eGFR is 85 mL/min/1.73 m². Serum uric acid is 9.1 mg/dL. He has no drug allergies and his current flare has settled.\nWhich is the most appropriate way to start urate-lowering therapy?","o":["Allopurinol 100 mg daily, titrate, plus colchicine","Allopurinol 600 mg daily from day one, no prophylaxis","Allopurinol only during each acute flare","Colchicine 0.5 mg daily alone as long-term therapy","Probenecid at full dose with a high-purine diet"],"a":0,"e":"Recurrent flares and tophi are indications for ULT. Allopurinol (xanthine oxidase inhibitor) is first line: start low and go slow, titrating to a target serum urate (lecturer pearl: < 6 mg/dL, lower with tophi), with flare prophylaxis such as low-dose colchicine for the first months because rapid urate falls trigger flares.","w":["Correct - start low, titrate to target, and cover with flare prophylaxis.","Wrong - high starting doses raise hypersensitivity risk and provoke flares, especially without prophylaxis.","Wrong - intermittent use causes urate swings; ULT is continuous, usually lifelong.","Wrong - colchicine prevents flares but does not lower urate or dissolve tophi.","Wrong - allopurinol is first line, and a high-purine diet works against urate lowering."]},{"t":"GOUT","stem":"A 66-year-old man has had recurrent painful swellings of both feet for 15 years, never treated. Foot radiographs show well-defined punched-out erosions with overhanging edges and sclerotic rims at the 1st MTP joints, with adjacent dense soft-tissue masses. Joint spaces are relatively preserved and there is no periarticular osteopenia.\nWhat is the most likely diagnosis?","o":["Rheumatoid arthritis","Chronic tophaceous gout","Calcium pyrophosphate arthropathy","Psoriatic arthritis","Primary osteoarthritis"],"a":1,"e":"Punched-out erosions with overhanging edges and sclerotic rims beside soft-tissue tophi, with joint space preserved until late and normal bone density, are the radiographic hallmarks of chronic tophaceous gout. RA erosions are marginal with periarticular osteopenia; PsA gives pencil-in-cup with new bone.","w":["Wrong - RA shows periarticular osteopenia and marginal erosions without overhanging edges or soft-tissue masses.","Correct - overhanging-edge erosions with sclerotic rims plus tophi = chronic gout.","Wrong - CPPD shows chondrocalcinosis and degenerative change, not tophaceous erosions.","Wrong - PsA shows pencil-in-cup deformity and fluffy periostitis.","Wrong - OA shows osteophytes, sclerosis and joint space loss, not punched-out erosions."]},{"t":"GOUT","stem":"A 44-year-old man has a serum uric acid of 8.4 mg/dL (500 µmol/L) on a routine health screen. He has never had joint pain, has no tophi and no renal stones. eGFR is normal. BMI is 29 kg/m² and he drinks sweetened soft drinks daily.\nWhat is the most appropriate management?","o":["Probenecid with high fluid intake","Lifelong colchicine prophylaxis","Start febuxostat 40 mg daily","Start allopurinol 100 mg daily","Lifestyle measures without ULT"],"a":4,"e":"This is asymptomatic hyperuricaemia: gout must not be diagnosed on uric acid alone, and most hyperuricaemic people never develop gout. Management is lifestyle modification (weight loss, cutting sugar-sweetened drinks, alcohol, red meat and seafood) and addressing cardiovascular risk; ULT is not routinely indicated.","w":["Wrong - uricosuric therapy is not indicated in the absence of gout.","Wrong - prophylaxis is only used to cover ULT initiation in established gout.","Wrong - febuxostat likewise is not indicated for asymptomatic hyperuricaemia.","Wrong - allopurinol is not routinely indicated without gout, stones or tophi.","Correct - asymptomatic hyperuricaemia is managed with lifestyle advice, not ULT."]},{"t":"GOUT","stem":"A 46-year-old Malay man with recurrent gout and a BMI of 30 kg/m² asks for dietary advice. He currently drinks two cans of sweetened soft drink daily and eats prawns and beef several times a week.\nWhich dietary item should he be ENCOURAGED to include?","o":["Low-fat dairy products","Shellfish such as prawns","Red meat such as beef","Beer in place of spirits","Sugar-sweetened soft drinks"],"a":0,"e":"Per the Malaysian CPG Gout 2nd ed., dairy products reduce the risk of gout. Alcohol, high-fructose corn syrup (sugar-sweetened drinks), red meat and seafood (except n-3 PUFA-rich fish) increase risk. Weight reduction also lowers serum urate.","w":["Correct - dairy intake is associated with a lower risk of gout.","Wrong - shellfish/seafood (other than oily n-3 fish) increases risk.","Wrong - red meat is a purine-rich risk factor.","Wrong - all alcohol raises risk, and beer is particularly purine-rich.","Wrong - fructose-sweetened drinks raise urate and gout risk."]},{"t":"CPPD","stem":"A 79-year-old woman develops a painful, warm, swollen right knee 2 days after a hip fracture operation. Temperature 37.6 °C. Aspirate: cloudy fluid, WCC 18,000/µL, Gram stain negative, with rhomboid-shaped crystals showing weak positive birefringence. Knee radiograph shows linear calcification within the menisci.\nWhat is the most likely diagnosis?","o":["Haemarthrosis","Acute gout flare","Osteoarthritis flare","Pseudogout (CPPD)","Septic arthritis"],"a":3,"e":"Rhomboid, weakly positively birefringent crystals plus chondrocalcinosis of the menisci in an elderly patient indicate acute calcium pyrophosphate crystal arthritis (pseudogout). It is classically provoked by surgery or acute illness and most often affects the knee. Culture should still be followed up.","w":["Wrong - haemarthrosis gives blood-stained fluid, not inflammatory fluid with crystals.","Wrong - gout crystals are needle-shaped and strongly negatively birefringent.","Wrong - OA fluid is non-inflammatory without crystals.","Correct - rhomboid weakly positive crystals + chondrocalcinosis in an elderly knee.","Wrong - Gram stain negative, crystals present and WCC below the usual septic range (culture still awaited)."]},{"t":"CPPD","stem":"A 41-year-old man has recurrent attacks of wrist and knee pain. Radiographs show calcification of the triangular fibrocartilage of the wrist and the knee menisci, with hook-like osteophytes at the 2nd and 3rd MCP joints. He has type 2 diabetes, slate-grey skin pigmentation and raised ALT.\nWhat is the most appropriate investigation for the underlying cause?","o":["HLA-B27 genotyping","Serum ACE level","Serum iron studies","Anti-CCP antibody","Serum uric acid level"],"a":2,"e":"Chondrocalcinosis (CPPD) in a patient under 55 should prompt a search for metabolic disease. Diabetes, skin pigmentation, abnormal LFTs and 2nd/3rd MCP hook osteophytes point to haemochromatosis, screened with ferritin and transferrin saturation. Other associations: hyperparathyroidism, hypomagnesaemia, hypophosphatasia, Wilson's disease.","w":["Wrong - HLA-B27 relates to spondyloarthritis.","Wrong - ACE relates to sarcoidosis, not CPPD.","Correct - screens for haemochromatosis, the classic secondary cause of CPPD in a young patient.","Wrong - anti-CCP tests for RA, which does not cause chondrocalcinosis.","Wrong - urate relates to gout, and chondrocalcinosis is calcium pyrophosphate."]},{"t":"CPPD","stem":"An 82-year-old woman with CKD stage 4 and a past bleeding peptic ulcer has an acutely swollen, warm left knee with a large effusion. Aspiration shows weakly positively birefringent rhomboid crystals; Gram stain is negative and WCC is 15,000/µL. She is afebrile.\nWhat is the most appropriate treatment?","o":["Allopurinol 100 mg daily","Aspirate + IA steroid","High-dose oral colchicine","Arthroscopic washout","Oral naproxen for two weeks"],"a":1,"e":"Acute pseudogout is treated with rest/splinting, NSAIDs or colchicine, and joint aspiration with intra-articular corticosteroid once infection is excluded. With severe CKD and a previous bleeding ulcer, NSAIDs and full-dose colchicine are unsafe, so local aspiration and steroid injection is best.","w":["Wrong - urate-lowering therapy has no role; the crystals are calcium pyrophosphate.","Correct - aspiration relieves pressure and IA steroid treats inflammation with no systemic toxicity.","Wrong - colchicine accumulates in severe CKD.","Wrong - washout is for septic arthritis; infection has been excluded.","Wrong - NSAIDs are unsafe with CKD 4 and previous ulcer bleeding."]},{"t":"CPPD","stem":"A 76-year-old man has a 2-day hot, swollen right knee with rigors. Temperature 39.2 °C, HR 112/min. Aspirate is turbid: WCC 95,000/µL (92% neutrophils). Polarised microscopy shows rhomboid weakly positively birefringent crystals. Gram stain and culture are pending. Radiograph shows meniscal chondrocalcinosis.\nWhat is the most appropriate next step?","o":["Empirical IV antibiotics and washout","NSAIDs and a knee splint only","Start allopurinol with prophylaxis","Oral colchicine and outpatient review","Intra-articular corticosteroid injection"],"a":0,"e":"Finding crystals does not exclude infection; crystal and septic arthritis can coexist. A WCC near 100,000/µL with systemic sepsis must be treated as septic arthritis: blood cultures, empirical IV antibiotics and urgent joint washout. Intra-articular steroid would be dangerous.","w":["Correct - very high WCC with sepsis is septic until proven otherwise, despite crystals.","Wrong - symptomatic treatment alone ignores probable infection.","Wrong - urate lowering has no role in CPPD or sepsis.","Wrong - discharging a septic joint risks cartilage destruction and sepsis.","Wrong - steroid injection into a possibly infected joint is dangerous."]},{"t":"PSA","stem":"A 45-year-old man with chronic plaque psoriasis has painful swelling of several fingers. One finger is diffusely swollen along its whole length. Hand radiographs show asymmetrical DIP joint erosions with a 'pencil-in-cup' appearance, fluffy periosteal new bone and normal bone density.\nWhat is the most likely diagnosis?","o":["Chronic tophaceous gout","Erosive osteoarthritis","Reactive arthritis","Psoriatic arthritis","Rheumatoid arthritis"],"a":3,"e":"Asymmetrical DIP disease, dactylitis, pencil-in-cup erosions and new bone formation without periarticular osteopenia are classic for psoriatic arthritis. RA spares DIPs, shows periarticular osteopenia and does not form new bone. Erosive OA gives central 'seagull' erosions.","w":["Wrong - gout erosions are punched-out with overhanging edges and tophi.","Wrong - erosive OA gives central 'seagull/gull-wing' erosions and osteophytes, not pencil-in-cup with periostitis.","Wrong - reactive arthritis mainly affects lower-limb large joints after infection.","Correct - pencil-in-cup + new bone + DIP + dactylitis in a psoriasis patient.","Wrong - RA spares DIPs and shows osteopenia without new bone formation."]},{"t":"PSA","stem":"A 38-year-old woman has swollen, tender joints in both hands. Examination shows involvement of several DIP joints, nail pitting and onycholysis, and tenderness at the Achilles insertion. Rheumatoid factor and anti-CCP are negative; CRP is raised. She has a small plaque behind one ear.\nWhich feature most strongly favours psoriatic arthritis over rheumatoid arthritis here?","o":["Raised C-reactive protein","Morning stiffness lasting 1 hour","DIP disease with nail changes","Symmetrical hand joint swelling","Female sex"],"a":2,"e":"DIP involvement with nail pitting/onycholysis, enthesitis and seronegativity favour PsA; RA characteristically spares DIPs. Raised CRP, morning stiffness and hand swelling occur in both inflammatory arthritides, so they do not discriminate.","w":["Wrong - raised CRP occurs in both conditions.","Wrong - inflammatory stiffness is a feature of both.","Correct - DIP arthritis with nail disease is characteristic of PsA and unusual in RA.","Wrong - hand swelling occurs in both.","Wrong - RA is more common in women, so sex does not favour PsA."]},{"t":"PSA","stem":"A 40-year-old man with psoriatic arthritis and extensive skin plaques has active disease despite methotrexate. He is started on ustekinumab.\nWhich best describes the mechanism of this drug?","o":["Neutralises tumour necrosis factor-alpha","Blocks the interleukin-6 receptor","Inhibits Janus kinase signalling","Depletes CD20-positive B cells","Blocks p40 shared by IL-12 and IL-23"],"a":4,"e":"Ustekinumab is a monoclonal antibody against the p40 subunit shared by IL-12 and IL-23, a biologic class separate from TNF inhibitors. The slide's 'TNF inhibitors eg: IL 12/23 inhibitors' is a slip: TNF inhibitors are adalimumab, etanercept and infliximab, while IL-12/23 and IL-17 inhibitors are distinct options in PsA.","w":["Wrong - that is adalimumab/etanercept/infliximab; ustekinumab is not a TNF inhibitor.","Wrong - IL-6 receptor blockade is tocilizumab (used in RA).","Wrong - JAK inhibition is tofacitinib/baricitinib (targeted synthetic DMARDs).","Wrong - B-cell depletion is rituximab.","Correct - ustekinumab targets the p40 subunit of IL-12 and IL-23."]},{"t":"PSA","stem":"A 57-year-old woman with long-standing untreated psoriasis has progressively shortened fingers. Several digits can be passively pulled out and pushed back in with skin folding. Radiographs show severe osteolysis of the phalanges with pencil-in-cup changes.\nWhat is the name of this pattern?","o":["Boutonnière deformity","Charcot neuroarthropathy","Arthritis mutilans","Swan-neck deformity","Erosive (inflammatory) OA"],"a":2,"e":"Arthritis mutilans is the most severe, destructive pattern of psoriatic arthritis: osteolysis of the phalanges and IPJs produces unstable, shortened 'telescoping' (opera-glass) digits. Swan-neck and boutonnière are tendon-imbalance deformities seen mainly in RA.","w":["Wrong - boutonnière is PIP flexion with DIP hyperextension from central slip rupture.","Wrong - Charcot joints occur with neuropathy (e.g. diabetic foot), not psoriatic phalangeal osteolysis.","Correct - osteolysis with telescoping digits is arthritis mutilans.","Wrong - swan-neck is PIP hyperextension with DIP flexion, not telescoping.","Wrong - erosive OA has central erosions but does not cause telescoping."]},{"t":"TBA","stem":"A 35-year-old man from Sabah has a 5-month history of a swollen, mildly warm right knee, low-grade evening fevers, night sweats and 6 kg weight loss. The quadriceps are wasted and there is a 15° flexion contracture. Radiograph shows juxta-articular osteopenia and erosions at the joint margins, with the joint space largely preserved.\nWhat is the most likely diagnosis?","o":["Pyogenic septic arthritis","Chronic tophaceous gout","Rheumatoid monoarthritis","Pigmented villonodular synovitis","Tuberculous arthritis"],"a":4,"e":"An insidious chronic monoarthritis of a weight-bearing joint with constitutional symptoms and the Phemister triad (juxta-articular osteopenia, peripheral erosions, gradual joint space narrowing) is classic TB arthritis. Pyogenic arthritis is acute and destroys cartilage within days, so joint space is lost early.","w":["Wrong - pyogenic arthritis presents acutely over days with early joint space loss.","Wrong - gout gives episodic acute flares and punched-out erosions, not constant fevers and osteopenia.","Wrong - RA is a symmetrical polyarthritis; isolated monoarthritis with weight loss and fevers points to TB.","Wrong - PVNS causes recurrent haemarthrosis without constitutional symptoms.","Correct - insidious monoarthritis + evening fever/weight loss + Phemister features."]},{"t":"TBA","stem":"A 42-year-old woman has a chronic swollen left knee for 6 months, with weight loss. Synovial fluid is turbid and xanthochromic with WCC 18,000/µL and low glucose. Acid-fast bacilli smear and Gram stain are negative. IGRA is positive. Chest X-ray is clear.\nWhich investigation offers the highest diagnostic yield?","o":["Sputum AFB smear on three days","Repeat synovial fluid AFB smear","Mantoux (tuberculin skin) test","Synovial biopsy for histology","MRI of the left knee with contrast"],"a":3,"e":"Synovial fluid AFB smears are frequently negative in TB arthritis. Synovial biopsy gives the best yield: histology shows epithelioid granulomas with caseating necrosis, and tissue culture/PCR confirms M. tuberculosis with drug sensitivities. IGRA and Mantoux show TB infection but cannot prove active joint disease.","w":["Wrong - the chest X-ray is clear; sputum is unlikely to be positive and does not prove joint TB.","Wrong - smears are often negative; repeating adds little.","Wrong - like IGRA, it shows infection, not active TB arthritis.","Correct - tissue histology (caseating granuloma) plus culture has the highest yield.","Wrong - MRI shows synovitis and erosions but cannot give a microbiological or histological diagnosis."]},{"t":"TBA","stem":"Two patients have a painful swollen knee. Patient A has a 3-day history, fever 39.5 °C and severe pain. Patient B has a 4-month history, evening fevers and weight loss.\nWhich radiographic feature most favours tuberculous over pyogenic arthritis?","o":["Normal periarticular bone density","Relatively preserved joint space","Early bony ankylosis","Rapid, early loss of joint space","Gas within the joint"],"a":1,"e":"TB pannus erodes the peripheral, non-weight-bearing margins and lacks the proteolytic enzymes of pyogenic infection, so cartilage and joint space are relatively preserved early (gradual narrowing) despite marked juxta-articular osteopenia. Pyogenic infection destroys cartilage within days and may heal by bony ankylosis; TB typically heals by fibrous ankylosis.","w":["Wrong - TB causes marked juxta-articular osteopenia.","Correct - relative preservation of joint space with marginal erosions is typical of TB (Phemister).","Wrong - bony ankylosis is a pyogenic outcome; TB tends to fibrous ankylosis.","Wrong - rapid joint space loss is typical of pyogenic infection.","Wrong - gas suggests gas-forming pyogenic organisms, not TB."]},{"t":"TBA","stem":"A 30-year-old man has culture-confirmed, drug-sensitive tuberculous arthritis of the right hip. Joint cartilage is largely preserved and there is no abscess. He weighs 60 kg and has normal liver function.\nWhat is the most appropriate definitive treatment, per the lecture slides?","o":["2EHRZ then 4–7HR (6–9 months)","Synovectomy without drug therapy","Isoniazid alone for 9 months","Six weeks of IV cloxacillin","Total hip replacement immediately"],"a":0,"e":"Bone and joint TB is treated medically with anti-tuberculous therapy: a 2-month intensive phase of ethambutol, isoniazid, rifampicin and pyrazinamide (2EHRZ), then a 4–7 month maintenance phase of isoniazid and rifampicin (4–7HR), for 6–9 months total. Surgery is reserved for abscess, severe destruction, deformity, drug resistance or atypical mycobacteria.","w":["Correct - standard ATT regimen for bone and joint TB per the slides.","Wrong - surgery never replaces ATT; synovectomy alone leaves active infection.","Wrong - isoniazid monotherapy treats latent TB only and breeds resistance in active disease.","Wrong - cloxacillin treats staphylococcal pyogenic arthritis, not TB.","Wrong - arthroplasty is reserved for destroyed joints after disease control, not first line."]}]},{"id":"tumour","title":"Musculoskeletal Tumours","short":"Tumours","emoji":"🎗️","source":"musculoskeletal tumours_compressed.pdf","topics":{"APP":"Approach: history, imaging, biopsy & margins","BEN":"Benign bone tumours","MAL":"Primary malignant bone tumours","CYS":"Simple & aneurysmal bone cysts","MM":"Multiple myeloma","MET":"Metastatic bone disease & Mirels score","STT":"Soft tissue tumours"},"cards":[{"t":"APP","q":"What are the commonest benign and malignant PRIMARY bone tumours?","a":"• Benign: **osteochondroma**\n• Malignant (overall, esp. children/adolescents): **osteosarcoma**\n• Malignant in adults: **chondrosarcoma** becomes the commonest\n• Location: ~60% of bone sarcomas arise in the **lower-limb long bones, especially around the knee**","m":"Kids make Osteo-SARCOMA; grown-ups make CHONDRO-sarcoma."},{"t":"APP","q":"A patient over 40 has a new lytic bone lesion. What should you think of FIRST, and why?","a":"• **Metastasis** (and **multiple myeloma**) first\n• In adults >40, metastases are **far commoner than primary bone sarcomas**\n• So: look for a primary (breast, prostate, lung, kidney, thyroid) and check SPEP/UPEP before calling it a sarcoma","m":"Over 40 + lytic = ‘mets or myeloma until proven otherwise’."},{"t":"APP","q":"What are the commonest benign and malignant soft tissue tumours (as taught in this lecture)?","a":"• Benign: **lipoma** (most soft tissue tumours are benign)\n• Malignant: **liposarcoma** is one of the commonest soft tissue sarcomas in adults\n• Soft tissue tumours arise from **mesenchymal** tissue: fat, muscle, fibrous tissue, vessels, peripheral nerves\n• Slightly **commoner in males**"},{"t":"APP","q":"Which features of PAIN in the history should raise suspicion of a bone tumour?","a":"• **Night pain** that wakes the patient\n• **Non-mechanical / rest pain**, not related to activity\n• **Progressive** pain, increasing as the mass grows\n• Pain **not responding to simple analgesia**\n• Plus systemic red flags: fever, weight loss, loss of appetite, previous cancer or radiotherapy","m":"Bone pain at night = tumour until proven otherwise."},{"t":"APP","q":"List the systematic points you describe on a plain X-ray of a bone lesion.","a":"• **Location**: which bone; epiphysis / metaphysis / diaphysis; central vs eccentric\n• **Solitary or multiple**\n• **Type**: lytic, sclerotic (blastic) or mixed; matrix (osteoid, chondroid ‘rings and arcs’)\n• **Zone of transition**: narrow (well defined) vs wide (ill defined)\n• **Periosteal reaction** and **cortex** (thinned, expanded, breached)\n• **Soft tissue mass**","m":"Where, how many, what is it made of, how does it meet bone, how does bone react."},{"t":"APP","q":"Which X-ray features suggest an AGGRESSIVE (likely malignant) bone lesion?","a":"• **Wide zone of transition** (ill-defined edge)\n• **Permeative / moth-eaten** bone destruction\n• **Interrupted periosteal reaction**: Codman triangle, sunburst, onion-skin\n• **Cortical breach** with a **soft tissue mass**\n• Benign pattern = narrow zone, sclerotic rim, solid periosteal reaction, intact cortex","m":"Lecturer pearl: a lesion the bone has had time to wall off (sclerotic rim) is slow; one it cannot contain (wide, permeative) is fast."},{"t":"APP","q":"Match the periosteal reaction to its classic tumour: Codman triangle, sunburst, onion-skin.","a":"• **Codman triangle**: periosteum lifted, new bone forms an angle with the cortex - aggressive lesions, classically **osteosarcoma**\n• **Sunburst** (spiculated, perpendicular): **osteosarcoma**\n• **Onion-skin** (lamellated, multilayered): **Ewing sarcoma**\n• All are **interrupted** reactions = aggressive growth","m":"Sun shines on Osteo; onions make you cry like Ewing."},{"t":"APP","q":"Lecturer pearl: which tumours classically arise in the epiphysis, metaphysis and diaphysis?","a":"• **Epiphysis**: **giant cell tumour** (skeletally mature, extends to subchondral bone), **chondroblastoma** (skeletally immature)\n• **Metaphysis**: **osteosarcoma**, **osteochondroma**, **simple and aneurysmal bone cysts**\n• **Diaphysis**: **Ewing sarcoma** (also osteoid osteoma, adamantinoma)","m":"Lecturer pearl: Ends = GCT/Chondroblastoma, Metaphysis = growth-plate tumours, Diaphysis = Ewing."},{"t":"APP","q":"What is the role of MRI, CT, bone scan and PET in a suspected bone sarcoma?","a":"• **MRI** (whole bone): **local extent** - marrow spread, soft tissue mass, joint and neurovascular involvement, **skip lesions**; best for soft tissue and cartilage lesions\n• **CT**: cortical detail, matrix; **CT chest** to stage the **lungs**\n• **Bone scan**: very sensitive for **skeletal metastases / skip lesions**\n• **PET(-CT)**: aggressiveness and distant (bone, lung, liver, nodal) spread","m":"MRI = local; CT chest = lungs; bone scan/PET = the rest of the skeleton."},{"t":"APP","q":"Lecturer pearl: state the key principles of biopsying a suspected primary bone or soft tissue sarcoma.","a":"• Biopsy is the **LAST investigation** - after imaging and staging\n• Done by (or planned with) **the surgeon / sarcoma centre doing the definitive resection**\n• **Core needle** (image-guided) preferred; track placed **along the future incision line** so it can be excised en bloc\n• **Longitudinal** incisions; avoid contaminating other **compartments, joints and the neurovascular bundle**\n• Meticulous haemostasis; no drains far from the wound","m":"Lecturer pearl: ‘The biopsy track is part of the tumour.’"},{"t":"APP","q":"Define the four Enneking surgical margins.","a":"• **Intralesional**: through the tumour (curettage, debulking) - fine for benign lesions; **tumour spill** in malignancy\n• **Marginal**: through the **pseudocapsule / reactive zone** - OK for benign/intermediate; leaves satellite cells → **local recurrence** in sarcoma\n• **Wide**: tumour + pseudocapsule + **cuff of normal tissue** - standard for sarcoma\n• **Radical**: removes the **entire anatomical compartment**","m":"In-the-lesion, at-the-margin, Wide cuff, Radical compartment: I-M-W-R gets progressively bigger."},{"t":"APP","q":"What are the principles of treating a primary bone sarcoma, and when is amputation chosen over limb salvage?","a":"• **Complete surgical resection** of the primary (and resectable metastases) with a **wide margin**, planned on **MRI/CT staging**\n• **Limb salvage**: resection + reconstruction (endoprosthesis, graft) - first choice when a wide margin is achievable\n• **Amputation**: **major neurovascular involvement**, **fungating** tumour, or **wide margins impossible**\n• Plus chemo/radiotherapy depending on tumour type","m":"Lecturer pearl: oncological clearance first, function second."},{"t":"BEN","q":"What is the classic presentation of osteoid osteoma, and why does aspirin/NSAID relieve it?","a":"• Adolescent/young adult **male** (10-35 y)\n• **Night pain** dramatically relieved by **NSAIDs/aspirin**\n• The **nidus produces prostaglandins** (high COX activity) → pain and surrounding inflammation; NSAIDs block COX\n• May cause synovitis/effusion if intra-articular, limp, limb-length discrepancy","m":"Night pain + NSAID magic = osteoid osteoma."},{"t":"BEN","q":"Where does osteoid osteoma occur, and how does it present in the spine?","a":"• **Long bones** (65-80%), **femur most common** (esp. **femoral neck**) and tibia; usually **diaphyseal/cortical**\n• Phalanges ~20%, vertebrae ~10%\n• Spine: **posterior elements**, mainly lumbar\n• Spinal lesion → **painful scoliosis** from **paravertebral muscle spasm** (lesion on the concave side - lecturer pearl)","m":"Painful scoliosis in a teenager = osteoid osteoma until proven otherwise."},{"t":"BEN","q":"What are the imaging findings of osteoid osteoma, and which test best shows the nidus?","a":"• X-ray: may be normal; **dense reactive sclerosis** and **solid cortical thickening** that may hide the nidus\n• **CT (investigation of choice)**: small **lucent nidus <2 cm** surrounded by sclerosis, ± **central sclerotic dot**\n• Bone scan: intensely **hot** (lecturer pearl: ‘double density’ sign)\n• Genetics: **FOS rearrangement** in ~90%","m":"Nidus is a ‘bullseye’: lucent ring, dense dot, sclerotic halo."},{"t":"BEN","q":"What is the preferred treatment of osteoid osteoma, and what is its natural history?","a":"• **CT-guided radiofrequency ablation (RFA)** - preferred, highly successful, minimally invasive\n• **NSAIDs** for symptom control while waiting / if surgery unwanted\n• Untreated it slowly **regresses**: pain settles over ~**3 years**, lesion over **5-7 years**\n• Open excision/curettage now rarely needed","m":"Burn the nidus: RFA."},{"t":"BEN","q":"Osteoid osteoma vs osteoblastoma: how do you tell them apart?","a":"• **Size**: osteoid osteoma nidus **<2 cm**; osteoblastoma **>2 cm** (2-10 cm)\n• **Site**: OO - femur/tibia cortex; OB - **spine posterior elements** (neural arch), axial skeleton\n• **NSAIDs**: OO pain **relieved**; OB pain usually **NOT** relieved\n• **Behaviour**: OO self-limiting; OB **progressive**, can be locally aggressive with neural compression\n• Both: **FOS** rearrangement","m":"Blastoma is the Big Brother: bigger, spinal, NSAID-resistant, keeps growing."},{"t":"BEN","q":"Does aspirin/NSAID relieve the pain of osteoblastoma?","a":"• **Usually NOT** - osteoblastoma pain is dull and typically **not relieved by aspirin or NSAIDs**\n• Contrast: **osteoid osteoma** night pain is **relieved by NSAIDs/aspirin** (prostaglandin-driven)\n• Note: slide says ‘relieved by aspirin not NSAIDs’; correct is that osteoblastoma pain is typically not relieved by either\n• Spinal osteoblastoma may cause **nerve root compression**","m":"NSAID test: works for the small one (OO), fails for the big one (OB)."},{"t":"BEN","q":"How is osteoblastoma treated, and what are the surgical complications?","a":"• **Extended intralesional curettage** (± bone graft); **RFA** for small-volume lesions\n• **En bloc resection** for aggressive/recurrent lesions\n• Complications: **recurrence 15-20%**, **heavy intraoperative haemorrhage** → reduce with **preoperative (percutaneous) embolisation**\n• Observation only rarely","m":"Blastoma bleeds and comes back: embolise, then curette well."},{"t":"BEN","q":"What is an osteochondroma and what are its X-ray features?","a":"• **Commonest benign bone tumour**; a cartilage-capped bony outgrowth from the **metaphysis**\n• **Cortex and medulla are continuous** with the host bone (key sign)\n• **Sessile or pedunculated** (‘cauliflower’ summit), stalk **points away from the joint**\n• Commonest sites: **distal femur**, proximal tibia, humerus; commonest tumour of the scapula\n• MRI shows the **cartilage cap** (thick in children, thins with age)","m":"A coat-hook pointing away from the knee."},{"t":"BEN","q":"What is hereditary multiple exostoses (multiple osteochondromas)?","a":"• **Autosomal dominant**; ~15% of osteochondromas (85% solitary/sporadic)\n• Germline mutation of **EXT1** (or **EXT2**) - biallelic inactivation in the lesion\n• Presents in childhood: multiple lumps, **short stature**, **limb-length discrepancy**, forearm/knee **deformities**\n• Higher lifetime risk of **secondary chondrosarcoma** than solitary lesions","m":"EXT = EXostosis genes."},{"t":"BEN","q":"What complications can a benign osteochondroma cause?","a":"• **Bursitis** over the tip (painful, may mimic growth)\n• **Nerve or vessel compression** (e.g. peroneal nerve, popliteal artery pseudoaneurysm - lecturer pearl)\n• **Fracture of the stalk**\n• **Mechanical block** to joint movement\n• **Limb-length discrepancy / deformity** (in multiple exostoses)\n• **Malignant transformation** to chondrosarcoma"},{"t":"BEN","q":"Lecturer pearl: which features suggest malignant transformation of an osteochondroma into chondrosarcoma?","a":"• **Cartilage cap >2 cm thick in an adult** (on MRI)\n• **Growth after skeletal maturity**\n• **New pain** (once bursitis/fracture excluded)\n• Irregular, ill-defined cap with scattered calcification or soft tissue mass\n• Pelvic/shoulder girdle and multiple-exostoses patients at higher risk","m":"Lecturer pearl: ‘Grown-ups do not grow osteochondromas.’ Adult growth or cap >2 cm = chondrosarcoma until proven otherwise."},{"t":"BEN","q":"When is excision of an osteochondroma indicated?","a":"• Asymptomatic: **no treatment** needed\n• Excise if: **pressure effects** on nerves/vessels/tendons, mechanical block, **cosmesis**, recurrent bursitis\n• **Suspected malignant transformation** in adults (growth, cap >2 cm, pain)\n• Excise at the base **including the cartilage cap and perichondrium** to prevent recurrence (lecturer pearl)"},{"t":"BEN","q":"What is an enchondroma and what does it look like on X-ray?","a":"• Benign **intramedullary hyaline cartilage** tumour; 10-30 y; often an **incidental** finding\n• **Most common primary bone tumour of the hand** - **proximal phalanx** commonest (~50% in hands/feet)\n• X-ray: **central**, well-defined, lobulated lytic lesion with thin sclerotic rim and **‘rings and arcs’ / popcorn calcification**\n• Hand lesions often present with a **pathological fracture**","m":"Popcorn in the finger."},{"t":"BEN","q":"Which features suggest an apparent enchondroma is really a low-grade chondrosarcoma?","a":"• **Pain without fracture**\n• **Axial / proximal site**: pelvis, ribs, scapula, sternum, proximal femur\n• Large size (>5 cm - lecturer pearl)\n• Deep **endosteal scalloping** (>2/3 of cortex), **cortical breach**, periosteal reaction, soft tissue mass\n• Malignant transformation risk in solitary enchondroma ~**5%** (far higher in Ollier/Maffucci)","m":"Painful, proximal, punching through cortex = chondrosarcoma."},{"t":"BEN","q":"Ollier disease vs Maffucci syndrome: what is the difference?","a":"• Both: **multiple enchondromas**, non-inherited, **IDH1/IDH2** mutations (lecturer pearl), deformity and limb shortening\n• **Ollier**: multiple enchondromas alone\n• **Maffucci**: enchondromas **+ soft tissue haemangiomas** (phleboliths on X-ray)\n• Both have a **high risk of chondrosarcoma**; Maffucci higher, plus other malignancies (e.g. angiosarcoma)","m":"Maffucci = More: more lesions (haemangiomas) and more malignancy."},{"t":"BEN","q":"How is an enchondroma managed?","a":"• Asymptomatic: **observation** ± serial X-rays\n• **Intralesional curettage and bone grafting** if painful or after **pathological fracture**\n• With a fracture: usually let the **fracture unite first**, then curette and graft (lecturer pearl)\n• **Biopsy** if appearance unclear or chondrosarcoma suspected"},{"t":"BEN","q":"What are the classic clinical and X-ray features of giant cell tumour of bone?","a":"• **Skeletally mature** adult, peak **20-30 y** (20-50)\n• Sites: **distal femur / proximal tibia** (50-65%), **distal radius**, sacrum, proximal humerus\n• X-ray: **eccentric lytic** lesion of the **epiphysis/metaphysis** extending to **subchondral bone**, narrow non-sclerotic margin, **‘soap bubble’** look\n• Presents with pain, swelling around knee; 5-10% with **pathological fracture**","m":"GCT = Grown-up, Close to joint, Thin soap bubble."},{"t":"BEN","q":"Why is giant cell tumour called ‘benign but locally aggressive’, and what does that mean for staging?","a":"• Osteoclast-like **giant cells** driven by **RANKL**-expressing stromal cells destroy bone\n• **High local recurrence** after simple curettage\n• Can give **benign pulmonary metastases** (~2-5%, lecturer pearl) → **CT chest** at staging\n• **Malignant transformation <10%**\n• Campanacci grades: I intraosseous, II cortical thinning/expansion, III cortical breach + soft tissue mass","m":"Benign histology, malignant manners."},{"t":"BEN","q":"How is giant cell tumour of bone treated?","a":"• **Extended intralesional curettage** (high-speed burr) + **adjuvant** (phenol / cryotherapy / argon - lecturer pearl) + **cement or bone graft** - Campanacci I-II and most III\n• **En bloc resection** + reconstruction when joint destroyed / extensive grade III\n• **Denosumab** (anti-**RANKL** antibody) for unresectable sites (sacrum, spine) or to downstage\n• Bisphosphonates, radiotherapy - adjuncts in selected cases","m":"RANK-L drives the giant cells; deno-SU-mab SUppresses RANKL."},{"t":"BEN","q":"Lecturer pearl: which important mimic must be excluded before diagnosing giant cell tumour, and how?","a":"• **Brown tumour of hyperparathyroidism** - histologically also giant-cell rich\n• Check **serum calcium, phosphate, ALP and PTH**\n• Clues: multiple lesions, subperiosteal resorption (radial side of middle phalanges), renal stones\n• Other differentials: **aneurysmal bone cyst**, chondroblastoma (immature skeleton), telangiectatic osteosarcoma","m":"Lecturer pearl: giant cells + high calcium = brown tumour, not GCT."},{"t":"MAL","q":"What is the age distribution of osteosarcoma, and what explains the second peak?","a":"• Most common **primary malignant bone tumour**\n• **Bimodal**: adolescence (10-14 y, growth spurt) and **elderly (7th decade)**\n• Second peak = **secondary osteosarcoma**: **Paget disease**, previous **radiotherapy**, chronic osteomyelitis, fibrous dysplasia\n• Male > female (1.4:1)","m":"Teens: growth spurt; old age: Paget and radiation."},{"t":"MAL","q":"Where does osteosarcoma typically arise?","a":"• **Metaphysis** of long bones (fastest growth)\n• **Distal femur** > **proximal tibia** > **proximal humerus** - i.e. **around the knee**\n• Arises within bone and spreads rapidly through the cortex into the periosteum and soft tissues","m":"Close to the knee, far from the elbow."},{"t":"MAL","q":"What are the genetic and acquired risk factors for osteosarcoma?","a":"• **RB1** mutation - hereditary **retinoblastoma**\n• **TP53** - **Li-Fraumeni syndrome** (breast cancer, brain tumours, adrenocortical carcinoma, sarcoma)\n• **Rothmund-Thomson syndrome** (autosomal recessive, poikiloderma) - note: slide spells it ‘Rothmound’\n• **Radiotherapy** (within ~20 y) or chemotherapy, **Paget disease**, chronic osteomyelitis, fibrous dysplasia","m":"RB, P53, Rothmund, Radiation, Paget."},{"t":"MAL","q":"What are the classic X-ray and histological features of osteosarcoma?","a":"• X-ray: aggressive **mixed lytic-sclerotic** metaphyseal lesion, wide zone of transition, **cortical breach + soft tissue mass**\n• **Codman triangle** and **sunburst** periosteal reaction\n• Histology (diagnostic): **malignant pleomorphic stromal cells directly producing lace-like osteoid**","m":"Malignant cells MAKING osteoid = osteosarcoma by definition."},{"t":"MAL","q":"Which blood tests matter in osteosarcoma and what do they tell you?","a":"• **Serum ALP and LDH**: raised levels reflect **high tumour volume** and a **poorer prognosis**; useful to monitor\n• **FBC, ESR, CRP**: baseline and to help **exclude osteomyelitis**\n• Renal/liver function and audiology/echo before chemotherapy (lecturer pearl)","m":"ALP = osteoblast activity; LDH = tumour bulk."},{"t":"MAL","q":"How is osteosarcoma staged, and where does it most commonly metastasise?","a":"• **MRI of the whole bone**: local extent, joint, neurovascular bundle, **skip lesions**\n• **CT chest**: **lungs = commonest site of metastasis**\n• **Bone scan / PET-CT**: skeletal metastases\n• Then **biopsy** (last), at the treating sarcoma centre","m":"Sarcomas spread by blood to the lungs - always CT the chest."},{"t":"MAL","q":"What is the standard treatment sequence for a high-grade osteosarcoma?","a":"• **Neoadjuvant multi-agent chemotherapy** (8-12 weeks): shrinks tumour, kills **micrometastases**, tests drug response\n• **Surgical resection with wide margins**: **limb salvage** + reconstruction where possible; amputation if neurovascular involvement, fungating, or wide margin impossible\n• **Adjuvant chemotherapy** to clear residual microscopic disease\n• Radiotherapy has little role (relatively radioresistant)","m":"Chemo - Cut - Chemo."},{"t":"MAL","q":"What are the main prognostic factors in osteosarcoma?","a":"• **Metastases at diagnosis** - the most important\n• **Histological response to neoadjuvant chemo**: **≥90% tumour necrosis** = good responder\n• **Surgical margin** achieved\n• Tumour **size/site** (axial worse), **raised ALP/LDH**\n• Skip lesions = poor","m":"Lecturer pearl: ‘Did it spread, and did it die on chemo?’"},{"t":"MAL","q":"Describe the typical chondrosarcoma patient and site.","a":"• **Second most common** primary malignant bone tumour; **commonest in adults**\n• Age **40-70**, male > female (3:2)\n• **Axial / proximal** skeleton: **pelvis**, **proximal femur**, proximal humerus, scapula, ribs\n• Deep, dull, gradually worsening pain ± swelling; pathological fracture","m":"Old, central, cartilage."},{"t":"MAL","q":"What is the difference between primary and secondary chondrosarcoma?","a":"• **Primary**: arises de novo (usually central, intramedullary)\n• **Secondary**: from a pre-existing benign cartilage lesion - **enchondroma** (central) or **osteochondroma** cartilage cap (peripheral)\n• High risk with **Ollier, Maffucci** and **multiple hereditary exostoses**\n• Also classified by location (central/peripheral) and cell type"},{"t":"MAL","q":"What are the imaging features of chondrosarcoma?","a":"• **‘Popcorn’ / rings-and-arcs chondroid calcification** in the medullary canal\n• **Deep endosteal scalloping** with **cortical thinning, expansion or thickening**\n• **Cortical destruction**, soft tissue mass in higher grades\n• **CT**: matrix calcification, permeative destruction; **MRI**: extent, areas of malignant change, helps grade","m":"Enchondroma with an attitude: scalloping deep and cortex breached."},{"t":"MAL","q":"Why is surgery the only curative treatment for chondrosarcoma?","a":"• Chondrosarcoma is **resistant to chemotherapy and radiotherapy**: **poor vascularity**, **slow cell division**, cells shielded by **dense cartilage matrix** (lecturer pearl)\n• So: **complete wide surgical resection** (radical resection/amputation in severe cases)\n• Grade 1 (low grade) in limbs may be managed with wide local excision (or extended curettage in selected cases)\n• Chemo/radiotherapy only **palliative**","m":"Cartilage has no blood supply - so drugs and rays cannot reach it: CUT it."},{"t":"MAL","q":"How does grade determine prognosis in chondrosarcoma?","a":"• **Grade I**: low cellularity, abundant hyaline matrix → ~5% metastasise, 5-year survival **90-100%**\n• **Grade II**: more cellular, enlarged nuclei → ~20% metastasise, ~**60%**\n• **Grade III**: highly cellular, pleomorphic, mitoses → ~70% metastasise, **30-40%**\n• Also depends on stage, size, site, resection margin","m":"Mets 5-20-70; survival 90-60-30."},{"t":"MAL","q":"Who gets Ewing sarcoma and where?","a":"• **Second most common primary malignant bone tumour in children**; age **10-20**, male > female\n• **Diaphysis** of long bones (femur, tibia, fibula), also **pelvis**, ribs, clavicle\n• Rarely in soft tissue (extraskeletal Ewing)\n• Origin: marrow mesenchymal stem cell with **neuroectodermal** features","m":"Ewing lives in the shaft."},{"t":"MAL","q":"What is the genetic hallmark and histology of Ewing sarcoma?","a":"• Translocation **t(11;22)(q24;q12)** → **EWS-FLI1** (EWSR1-FLI1) fusion protein (note: slide writes ‘EWS-FL1’)\n• Histology: sheets of monotonous **small round blue cells**, high nuclear:cytoplasmic ratio, **pseudo-rosettes**\n• IHC: strong membranous **CD99** (~95%)\n• Necrotic tumour may look like **pus** at biopsy","m":"Ewing at 11:22 - eleven-twenty-two, CD-ninety-nine."},{"t":"MAL","q":"Why is Ewing sarcoma often mistaken for osteomyelitis?","a":"• **Fever**, night sweats, malaise, **raised ESR/CRP** and **leucocytosis**\n• Warm, tender swelling\n• Permeative, **moth-eaten** lesion with periosteal reaction on X-ray (like infection)\n• Biopsy material can look like **pus**\n• So: send **biopsy for histology AND culture** in every ‘osteomyelitis’ (lecturer pearl)","m":"Lecturer pearl: ‘Culture every tumour, biopsy every infection.’"},{"t":"MAL","q":"What are the X-ray features of Ewing sarcoma?","a":"• **Permeative / moth-eaten** lytic destruction of the **diaphysis**\n• **Onion-skin** (lamellated, multilayered) periosteal reaction; may show Codman triangle\n• Often a **large soft tissue mass** out of proportion to bone change\n• Little or no matrix mineralisation (unlike osteosarcoma)","m":"Moth-eaten onion in the shaft."},{"t":"MAL","q":"How is Ewing sarcoma staged, and which test is specific to it compared with osteosarcoma?","a":"• **MRI whole bone**: intraosseous extent, skip lesions, soft tissue\n• **CT chest**: pulmonary metastases\n• **Bone scan / PET-CT**: skeletal metastases\n• **Bone marrow aspirate and trephine biopsy** - Ewing spreads to **marrow**\n• **LDH**: raised = larger tumour, poorer prognosis","m":"Ewing is a marrow tumour - so sample the marrow."},{"t":"MAL","q":"How is Ewing sarcoma treated, and how does it differ from osteosarcoma?","a":"• **Neoadjuvant chemotherapy** (8-12 weeks) → **local control** → **adjuvant chemotherapy** (6-12 months)\n• Local control: **wide surgical resection** preferred (lower local recurrence ~5-10%)\n• Ewing is **radiosensitive** (unlike osteosarcoma): **radiotherapy** for positive margins, metastatic disease, or **unresectable sites** (spine, pelvis)\n• Radiotherapy alone: higher local recurrence (~35%) and late effects - growth disturbance, contracture, fracture, **secondary malignancy**","m":"Ewing is radiosensitive; osteosarcoma and chondrosarcoma are not."},{"t":"MAL","q":"What are the poor prognostic factors in Ewing sarcoma?","a":"• **Metastases at diagnosis** - the most important (bone/marrow mets worse than lung-only)\n• **Axial site**: spine/pelvis worst > proximal limb > distal limb (best)\n• **Size >8 cm**, extensive marrow involvement\n• **Poor chemo response**: <90% necrosis\n• Older age (>14), male, **raised LDH**, additional **TP53** mutation","m":"Big, central, spread, and chemo-resistant = bad."},{"t":"CYS","q":"What is a simple (unicameral) bone cyst and where does it typically occur?","a":"• Solitary, **unilocular** cavity lined by a **thin fibrous membrane** (no epithelium), filled with **serous / straw-coloured fluid**\n• Age **<20**, male > female (~2:1)\n• **Proximal humerus** > proximal femur > proximal tibia\n• **Central, metaphyseal**, adjacent to the physis; migrates towards the diaphysis with growth","m":"Simple = Single chamber, Straw fluid, Shoulder (humerus)."},{"t":"CYS","q":"How does a simple bone cyst usually present and what is the pathognomonic X-ray sign?","a":"• ~80% **asymptomatic** until a **pathological fracture** after minor trauma\n• X-ray: **central**, well-defined lucent metaphyseal lesion, thinned slightly expanded cortex, may look septated\n• **Fallen fragment (‘fallen leaf’) sign**: fractured cortical fragment **sinks to the dependent part** of the fluid-filled cyst - pathognomonic\n• Diagnosis usually on history, exam and X-ray alone","m":"A leaf falls through water, not through solid tumour."},{"t":"CYS","q":"How is a simple bone cyst managed?","a":"• Fracture: **immobilise (e.g. sling)** and let it heal; some cysts heal after fracture\n• **Aspiration + methylprednisolone acetate injection** for active cysts (± bone marrow/demineralised matrix - lecturer pearl)\n• **Curettage and bone grafting ± internal fixation**: failed injections, displaced fractures, weight-bearing sites (proximal femur)\n• Advanced imaging/biopsy only if malignancy cannot be excluded"},{"t":"CYS","q":"What are the complications of a simple bone cyst?","a":"• **Recurrence** 10-20% after treatment (higher in young ‘active’ cysts near the physis)\n• **Growth arrest / limb shortening** (physeal damage, large cysts)\n• **Avascular necrosis of the femoral head** after proximal femoral fracture\n• Malunion, repeated pathological fractures"},{"t":"CYS","q":"What is an aneurysmal bone cyst?","a":"• Benign, **expansile**, locally aggressive lesion of **blood-filled spaces** separated by septa, **without endothelial lining**\n• Age mostly **<20** (10-30); equal sex distribution\n• **Eccentric metaphyseal** lesion of long bones (femur, tibia, humerus) and **posterior elements of the spine**\n• Can be **primary** (USP6 rearrangement) or **secondary** to GCT, osteoblastoma, chondroblastoma, osteosarcoma (lecturer pearl)\n• Spinal ABC may cause neurological deficit","m":"ABC = A Blood Cyst that blows out the bone."},{"t":"CYS","q":"What are the imaging features of aneurysmal bone cyst, and which dangerous lesion mimics it?","a":"• X-ray: **eccentric, expansile, ‘blown-out’ bubbly lytic lesion** with thin cortical shell\n• MRI: multiple septations with **fluid-fluid levels** (blood products settling)\n• Key mimic: **telangiectatic osteosarcoma** (also fluid-fluid levels) - also GCT, SBC\n• So **biopsy is required** to confirm diagnosis","m":"Fluid-fluid levels: think ABC, but exclude telangiectatic osteosarcoma."},{"t":"CYS","q":"How is an aneurysmal bone cyst treated?","a":"• **Aggressive curettage (± adjuvant: burr, phenol, cryotherapy) + bone grafting** - standard for symptomatic lesions\n• **Sclerotherapy** (e.g. **polidocanol**) - causes fibrosis of cyst spaces\n• **Selective arterial embolisation** - blocks inflow; useful in spine/pelvis or before surgery\n• **Recurrence up to 20%**"},{"t":"CYS","q":"Simple bone cyst vs aneurysmal bone cyst: key differences?","a":"• **Position**: SBC **central**; ABC **eccentric**\n• **Contents**: SBC **serous fluid**; ABC **blood**\n• **Expansion**: SBC mild; ABC marked, ‘blown-out’\n• **Imaging sign**: SBC **fallen fragment**; ABC **fluid-fluid levels**\n• **Site**: SBC proximal humerus/femur; ABC long bones + **spinal posterior elements**\n• **Diagnosis**: SBC on X-ray; ABC needs **biopsy**","m":"Simple sits in the middle; Aneurysmal bulges to the side."},{"t":"MM","q":"What is multiple myeloma and who typically gets it?","a":"• Malignant proliferation of **clonal plasma cells (B-cell lineage) in the bone marrow**\n• Older adults (typically **>60** - lecturer pearl)\n• **Commonest primary malignancy of bone** in older adults (lecturer pearl)\n• Produces monoclonal immunoglobulin (**M-protein**) and/or free light chains (**Bence Jones protein**)"},{"t":"MM","q":"What does the mnemonic CRAB stand for in myeloma?","a":"• **C**alcium raised - hypercalcaemia (bone resorption)\n• **R**enal impairment - light-chain cast nephropathy, hypercalcaemia\n• **A**naemia - marrow replacement → fatigue\n• **B**one lesions - lytic lesions, bone pain, **pathological fractures**\n• Also recurrent infections (immunoparesis)","m":"Old man feeling CRAB-by with back pain = myeloma."},{"t":"MM","q":"How does myeloma destroy bone, and why is the bone scan often normal?","a":"• Myeloma cells activate the **RANKL** system → **osteoclast** activation → lytic lesions, diffuse osteoporosis, cortical thinning\n• They also **suppress osteoblasts** (lecturer pearl: e.g. DKK1)\n• No reactive new bone → **ALP usually normal** and **bone scan ‘cold’ / false negative**\n• Hence use skeletal survey, low-dose CT or MRI instead","m":"Bone scan sees osteoBLASTS; myeloma has switched them off."},{"t":"MM","q":"Which investigations confirm multiple myeloma?","a":"• **Serum and urine protein electrophoresis** (SPEP/UPEP) ± immunofixation: **M-band**, Bence Jones protein\n• **Serum free light chains** (kappa:lambda ratio) - lecturer pearl\n• **Bone marrow aspirate and biopsy**: clonal plasma cells (≥10% - lecturer pearl)\n• Supporting: FBC, renal profile, **calcium**, ESR, albumin, **beta-2 microglobulin** (prognosis; note: slide says ‘macroglobulin’)","m":"Protein, light chains, marrow."},{"t":"MM","q":"What imaging is used in myeloma and what are the classic findings?","a":"• **Skeletal survey** (skull, spine, pelvis, ribs, humeri, femora): **punched-out lytic lesions**, **‘pepper-pot’ skull**, diffuse osteopenia, vertebral collapse\n• **Whole-body low-dose CT** - more sensitive, now preferred; shows fractures, soft tissue masses, fracture-risk areas\n• **MRI / PET-CT**: marrow infiltration, response to treatment\n• **Avoid relying on bone scan** - often falsely negative","m":"Pepper-pot skull, punched-out holes, cold bone scan."},{"t":"MM","q":"How is multiple myeloma managed?","a":"• **Systemic therapy**: combinations of chemotherapy/proteasome inhibitor, **steroid** and **immunomodulatory** agent (e.g. bortezomib, lenalidomide, dexamethasone - lecturer pearl)\n• **Autologous stem-cell transplant** in fit patients\n• Bone disease: **bisphosphonates** (or denosumab)\n• Surgery: **stabilise** existing/impending pathological fractures, **decompress** spinal cord, pain relief; radiotherapy for painful lesions"},{"t":"MET","q":"What is the commonest malignant tumour of bone, and which primaries most often spread to bone?","a":"• **Metastases** - far commoner than primary bone tumours, especially **>40 y**\n• Primaries: **Breast, Prostate, Kidney, Thyroid, Lung**\n• Mnemonic (lecturer pearl): **‘Lead Kettle’ = PbKTL** - Pb (Prostate, breast), K (kidney), T (thyroid), L (lung)","m":"Lead Kettle: Pb-K-T-L."},{"t":"MET","q":"Which metastases are typically lytic, blastic or mixed?","a":"• **Lytic**: **lung, kidney, thyroid** - ill-defined, punched-out, thinned trabeculae\n• **Blastic (sclerotic)**: **prostate** (~90%) - dense white nodular patches\n• **Mixed**: **breast** (can be lytic, blastic or mixed)\n• **Kidney and thyroid mets are hypervascular** → **preoperative embolisation**","m":"Prostate makes bone (blastic); kidney and thyroid eat it and bleed."},{"t":"MET","q":"Where in the skeleton do metastases most often go, and why?","a":"• **Spine** (esp. thoracic/lumbar) > **pelvis** > **ribs** > **proximal femur** > **proximal humerus**\n• Red-marrow-rich axial skeleton with high blood flow\n• Spinal spread via the **valveless Batson vertebral venous plexus** (lecturer pearl)\n• Mets **distal to elbow/knee** (acral) are rare - think **lung** primary (lecturer pearl)"},{"t":"MET","q":"What are the three types of pain in metastatic bone disease and what do they imply?","a":"• **Tumorigenic**: dull, boring, gradual, **worse at night** - tumour activity\n• **Mechanical**: pain on **weight-bearing / activity** - structural weakness → **impending fracture**\n• **Radicular**: sharp, shooting, electric-shock along a **dermatome** - nerve root compression","m":"Night = tumour; walking = fracture risk; shooting = nerve."},{"t":"MET","q":"What are the early and late signs of metastatic spinal cord compression and the immediate actions?","a":"• **Early**: **back pain** (esp. thoracic, night, worse lying), **limb weakness**, **paraesthesia/numbness** at or below the level\n• **Late**: **autonomic** - bladder/bowel dysfunction, impotence\n• Actions (lecturer pearl): urgent **MRI of the whole spine**, **high-dose dexamethasone**, urgent spinal surgery and/or **radiotherapy**\n• Do not wait for sphincter loss - outcome depends on function at presentation","m":"Lecturer pearl: walk in, walk out - treat before paralysis."},{"t":"MET","q":"What are the symptoms of hypercalcaemia of malignancy?","a":"• **GI**: nausea, anorexia, abdominal pain, **constipation**\n• **Neurological**: **confusion**, altered mental state, depression\n• **Renal**: **polyuria, polydipsia**, dehydration, stones\n• Treat (lecturer pearl): **IV normal saline** then **IV bisphosphonate**","m":"Bones, stones, abdominal groans and psychic moans."},{"t":"MET","q":"How do you work up a bone lesion suspected to be metastatic with no known primary?","a":"• History/exam: **breast, prostate, thyroid**, lungs, abdomen, lymph nodes\n• Bloods: FBC, ESR, renal & liver function, **calcium**, **ALP**, **PSA**, **SPEP/UPEP**, LDH, coagulation\n• **CT chest/abdomen/pelvis** (search for primary) + **bone scan / PET** (other lesions); **MRI** most sensitive for marrow mets\n• **Biopsy LAST** - a solitary lesion must be biopsied to **exclude a primary bone sarcoma** before any fixation","m":"Never nail a solitary lesion until you know it is not a sarcoma."},{"t":"MET","q":"What are the four components of Mirels' score and how is each scored?","a":"• **Site**: upper limb **1**, lower limb **2**, **peritrochanteric 3**\n• **Pain**: mild **1**, moderate **2**, **functional** (on weight-bearing) **3**\n• **Lesion**: blastic **1**, mixed **2**, **lytic 3**\n• **Size** (fraction of cortical diameter): <1/3 **1**, 1/3-2/3 **2**, **>2/3 3**\n• Range 4-12 (note: slide writes ‘Mirel's’; correct is Mirels')","m":"Site-Pain-Lesion-Size, 1-2-3 each; the worst of each = 3."},{"t":"MET","q":"How does the Mirels' score guide management of a long-bone metastasis?","a":"• **≤7**: low fracture risk → **radiotherapy** and observation\n• **8**: borderline → **clinical judgement**\n• **≥9**: high risk (score 9 ≈ **33% fracture risk**) → **prophylactic fixation BEFORE radiotherapy**\n• Why fix first: radiotherapy causes temporary bone weakening/ delayed healing, and fixing an impending fracture is easier and safer than a completed one","m":"Nine or more? Nail before the rays."},{"t":"MET","q":"What treatment options exist for metastatic bone disease?","a":"• **Medical**: analgesic ladder (NSAIDs → opioids), **bisphosphonates / denosumab**, chemotherapy, **hormonal** and targeted therapy\n• **Radiation**: external beam, stereotactic body RT; **radium-223 / strontium-89** for diffuse blastic pain\n• **Surgery**: **intramedullary nail** for shaft lesions (protects whole bone), **arthroplasty/endoprosthesis** for periarticular lesions; **preop embolisation** for renal/thyroid\n• **Minimally invasive**: RFA, cryoablation, **cementoplasty**; palliative care"},{"t":"STT","q":"Which features of a soft tissue mass are red flags for sarcoma?","a":"• **Size >5 cm**\n• **Deep to the deep fascia**\n• **Increasing in size**\n• **Painful**\n• **Recurrence** after previous excision\n• Any one → **MRI** and **urgent referral to a sarcoma centre BEFORE any excision**","m":"Lecturer pearl: ‘Bigger than a golf ball, deep, growing, painful or back again.’"},{"t":"STT","q":"What is a ‘whoops’ excision, and why must it be avoided?","a":"• Unplanned shelling-out of a presumed benign lump that turns out to be a **sarcoma**\n• Margins are **positive**; tumour cells spilled through the whole operative field and tissue planes\n• Needs much larger **re-excision ± radiotherapy**, sometimes amputation; worse local control\n• Prevent: **MRI first**, **core needle biopsy planned by the sarcoma team**","m":"Lecturer pearl: if in doubt, scan it - do not cut it."},{"t":"STT","q":"What are the general treatment principles for an adult soft tissue sarcoma of a limb?","a":"• Stage first: **MRI** (local) + **CT chest** (lungs = commonest metastatic site); **core biopsy** at the sarcoma centre\n• **Wide local excision** (tumour + biopsy tract + cuff of normal tissue) with limb preservation where possible\n• **Radiotherapy** neoadjuvant or adjuvant for high grade, deep, large tumours or close margins\n• **Chemotherapy** for chemosensitive types (rhabdomyosarcoma, synovial sarcoma) or metastatic disease\n• Amputation only when a functional limb with clear margins is impossible","m":"Scan, stage, sample, then Wide excision + radiotherapy."},{"t":"STT","q":"What are the features of a simple lipoma and how is it managed?","a":"• **Commonest benign soft tissue tumour**; middle to old age\n• **Soft, painless, mobile, slow-growing, lobulated**; subcutaneous on back, neck, shoulder, proximal limbs (or intramuscular)\n• Mature adipocytes in lobules\n• Diagnosis clinical; **ultrasound** for superficial lumps; **MRI** if large or deep\n• Asymptomatic: observe; symptomatic: **marginal excision** (recurrence rare superficially, commoner intramuscular)","m":"Slip sign: the edge slips away under the finger."},{"t":"STT","q":"On MRI, which features suggest an atypical lipomatous tumour / well-differentiated liposarcoma rather than a lipoma?","a":"• **Large** (>10 cm - lecturer pearl), **deep** (intramuscular/retroperitoneal)\n• **Thick, irregular, enhancing septa** (>2 mm)\n• **Nodular or globular non-fatty soft tissue** components\n• Less than ~75% fat\n• Confirm with **core needle biopsy** (MDM2 amplification - lecturer pearl)","m":"A lipoma looks like pure fat; a liposarcoma is fat with lumps and thick strings."},{"t":"STT","q":"Where does liposarcoma occur and what are its subtypes?","a":"• Adults after the 3rd decade; **deep**: **thigh**, groin, calf, popliteal fossa, buttock, retroperitoneum\n• **Well-differentiated (ALT)**: low grade\n• **Myxoid**: intermediate grade - t(12;16) FUS-DDIT3 (lecturer pearl)\n• **Round cell, pleomorphic, dedifferentiated**: high grade\n• May cause nerve compression or limb oedema from venous occlusion","m":"Deep thigh fat in an adult = liposarcoma until proven otherwise."},{"t":"STT","q":"How is liposarcoma investigated and treated?","a":"• **MRI** for local extent; **CT (chest)** for staging; **core needle biopsy** for subtype/grade\n• **Wide local excision** - mainstay (well-differentiated)\n• **Radiotherapy**: neoadjuvant to reduce recurrence, or adjuvant for close margins / high grade (myxoid is radiosensitive - lecturer pearl)\n• **Chemotherapy**: metastatic or unresectable high-grade disease"},{"t":"STT","q":"What are the superficial fibromatoses?","a":"• Myofibroblast proliferation that lays down collagen and **contracts**\n• **Palmar** - Dupuytren disease\n• **Plantar** - Ledderhose disease\n• **Penile** - Peyronie disease\n• **Knuckle pads** - Garrod disease\n• Firm painless nodules, skin puckering, contracture; family history; recurrence common. Treat symptomatic disease with **collagenase** or **(dermo)fasciectomy**","m":"Dupuytren's hand, Ledderhose foot, Peyronie's... elsewhere, Garrod's knuckles."},{"t":"STT","q":"What is desmoid-type fibromatosis and how is it managed?","a":"• **Deep, infiltrative, locally aggressive** myofibroblastic tumour that **does not metastasise**\n• Sporadic: **beta-catenin (CTNNB1) mutation** in ~85%; syndromic: **FAP / Gardner (APC)** - lecturer pearl\n• Sites: abdominal wall, chest wall, shoulder, thigh, mesentery\n• **~50% recurrence** after surgery\n• Asymptomatic: **active surveillance**; symptomatic: **NSAIDs, tamoxifen**, chemotherapy, radiotherapy, surgery","m":"Desmoid: Does not spread, but Doesn't stay away (recurs)."},{"t":"STT","q":"What are the key features of dermatofibrosarcoma protuberans (DFSP)?","a":"• **Low-grade** malignant dermal tumour; males, 3rd-5th decade; **trunk**, groin, proximal limbs\n• Slow-growing **erythematous/violaceous plaque** that becomes **nodular / protuberant**\n• Histology: spindle cells in a **storiform (cartwheel)** pattern with **honeycomb infiltration** of fat; **CD34 positive**\n• **Locally aggressive** (~50% recurrence if inadequately excised), rarely metastasises\n• **Wide excision** or **Mohs** surgery; imatinib for advanced disease (COL1A1-PDGFB - lecturer pearl)","m":"DFSP: Storiform, Sticking up, CD34."},{"t":"STT","q":"Fibrosarcoma vs myxofibrosarcoma: how do they differ?","a":"• **Fibrosarcoma**: adults ~50 y; **deep** mass in thigh/trunk/arm; spindle cells in a **herringbone** pattern; mets to **lung and bone**\n• **Myxofibrosarcoma**: **elderly** (~60 y); usually **subcutaneous** in limbs; **myxoid background**, pleomorphic cells, **curvilinear vessels**; **infiltrative margins** → high local recurrence\n• Both: MRI, core biopsy, **CT chest**, **wide excision** ± radiotherapy","m":"Herringbone = fibrosarcoma; jelly + curly vessels = myxofibrosarcoma."},{"t":"STT","q":"What are the types of haemangioma and how are soft tissue haemangiomas managed?","a":"• **Capillary**: superficial red patch (‘birthmark’)\n• **Cavernous**: sponge-like blood spaces, may extend into fascia and muscle; aching/heaviness worse with activity\n• X-ray: **phleboliths**; **MRI with gadolinium** separates it from AVM and angiosarcoma\n• **NSAIDs, observation, compression stockings** first; **sclerotherapy/embolisation** for large painful lesions; excision if resistant","m":"Phleboliths = small calcified clots in slow-flow vessels."},{"t":"STT","q":"What is the classic triad and the two bedside tests of a glomus tumour?","a":"• Benign perivascular (glomus body) tumour, typically **subungual**, age 20-40\n• **Triad**: **paroxysmal pain**, **exquisite pinpoint tenderness**, **cold intolerance**\n• Small **bluish** spot under the nail, nail ridging\n• **Love (pin) test**: pinhead pressure reproduces the pain\n• **Hildreth (tourniquet) test**: pain abolished after exsanguination and cuff inflation","m":"Love the pin, Hildreth the cuff."},{"t":"STT","q":"How is a glomus tumour investigated and treated?","a":"• X-ray: **pressure erosion** of the underlying distal phalanx\n• **MRI**: small, oval, well-defined enhancing mass (most sensitive)\n• **Surgical excision** (usually through the nail bed) when symptoms affect quality of life - curative\n• Large nail-bed defects: reconstruct (e.g. autologous fat graft)"},{"t":"STT","q":"What are the risk factors and prognosis of angiosarcoma?","a":"• Rare, aggressive malignant tumour of **vascular endothelium**\n• Risk factors: **previous radiotherapy**, **chronic lymphoedema / vascular stasis** (Stewart-Treves after mastectomy - lecturer pearl), **polyvinyl chloride**, trauma, foreign material/AV fistula, **Maffucci**\n• Overlying **skin changes**, bruising; may cause **coagulopathy, anaemia**\n• **Poor prognosis**: ~50% die in the first year; mets to lung, bone, soft tissue, nodes","m":"Radiation, lymphoedema, PVC - think angiosarcoma."},{"t":"STT","q":"What are the features of leiomyosarcoma?","a":"• Aggressive malignant **spindle-cell tumour of smooth muscle** (note: slide spells it ‘Leiomysarcoma’)\n• Sites: **retroperitoneum**, skin, and **large vessels** (IVC, iliac, femoral vein) → venous occlusion and **limb swelling**\n• Abdominal mass, pain, weight loss, nausea\n• Highly **vascular** on angiography/duplex\n• Poor prognosis (5-year survival ~25%); mets to lung, bone, soft tissue, skin"},{"t":"STT","q":"What is pigmented villonodular synovitis (tenosynovial giant cell tumour) and how does it present?","a":"• Benign but locally aggressive proliferation of synovium/tendon sheath with **histiocytes, giant cells and haemosiderin**; renamed **TGCT** by WHO\n• Types: **giant cell tumour of tendon sheath**, **localised PVNS**, **diffuse intra-articular PVNS**\n• Young adults; **knee** > hip, ankle\n• **Insidious pain, swelling, stiffness** and **recurrent atraumatic haemarthrosis** (brown, blood-stained aspirate)\n• Note: slide spells ‘villonodullar’; correct is villonodular","m":"Young knee bleeding again and again without injury or clotting disorder = PVNS."},{"t":"STT","q":"How is PVNS diagnosed and treated?","a":"• X-ray/CT: **cystic erosions on both sides of the joint**, joint space preserved early\n• **MRI (most sensitive)**: low-signal synovial masses with **‘blooming’ on gradient echo** from **haemosiderin**\n• Arthroscopy: brown/red **frond-like** papillary synovium; biopsy confirms\n• Treatment: **total synovectomy** (gold standard), arthroplasty if joint destroyed; radiotherapy/radiosynovectomy; **tyrosine kinase (CSF1R) inhibitors** for recurrent diffuse disease\n• High recurrence in diffuse form","m":"Iron (haemosiderin) blooms on gradient echo."},{"t":"STT","q":"What are the key features of synovial sarcoma?","a":"• High-grade sarcoma of **adolescents/young adults** (15-40 - lecturer pearl)\n• **Periarticular** (near, rarely within, joints), **80% lower limb**, esp. around the **knee**; may be painful or painless\n• **Not from synovium** despite the name\n• Genetics: **t(X;18)(p11;q11) → SS18-SSX** fusion\n• X-ray/CT: **small peripheral calcifications**; MRI: heterogeneous ‘triple signal’ with septa and fluid levels\n• Can spread to **lymph nodes**; treat with wide excision + radiotherapy ± chemotherapy","m":"X marks the synovial sarcoma: t(X;18)."},{"t":"STT","q":"Schwannoma vs neurofibroma: how do they differ?","a":"• **Schwannoma**: Schwann cells, **encapsulated**, **eccentric** to the nerve → can be **shelled out (enucleated)** preserving fascicles; flexor surfaces, head & neck\n• **Neurofibroma**: **central/fusiform**, fascicles run **through** it → cannot be enucleated without sacrificing the nerve; associated with **NF1** (multiple, plexiform)\n• Both: mobile side-to-side not along the nerve, **Tinel-like tingling**, MRI","m":"Schwannoma sits beside the nerve (shell it); neurofibroma swallows the nerve."},{"t":"STT","q":"What musculoskeletal features are associated with neurofibromatosis type 1?","a":"• Multiple **neurofibromas** (cutaneous, plexiform), café-au-lait spots, axillary freckling (lecturer pearl)\n• **Scoliosis** (dystrophic), **congenital pseudarthrosis of the tibia**\n• **Overgrowth** of a digit or whole limb\n• Nerve root lesions can **mimic disc prolapse**\n• Risk of **MPNST** - leading cause of death in NF1"},{"t":"STT","q":"When should you suspect a malignant peripheral nerve sheath tumour (MPNST), and how is it investigated?","a":"• ~50% arise from a **neurofibroma in NF1** (rest sporadic)\n• Red flags: **rapidly enlarging, painful** neurofibroma, new **neurological deficit** (numbness, weakness)\n• Major nerves: sciatic (thigh), brachial plexus, pelvis\n• **MRI** + **FDG-PET** (high uptake identifies malignant change, guides biopsy)\n• Treat: **wide surgical resection + radiotherapy**; poor prognosis","m":"NF1 lump that suddenly grows and hurts = MPNST."},{"t":"STT","q":"What are the subtypes of rhabdomyosarcoma and who gets them?","a":"• **Commonest soft tissue sarcoma of children**; malignant striated (skeletal) muscle cells\n• **Embryonal** (commonest): infants/young children - head & neck, genitourinary\n• **Botryoid** (embryonal variant): infants - grape-like mass in hollow organs\n• **Alveolar**: adolescents/young adults - limbs; t(2;13) PAX3-FOXO1 (lecturer pearl)\n• **Pleomorphic**: older adults 40-70\n• IHC: **desmin, myogenin** (lecturer pearl); biopsy gold standard; chemo + surgery ± radiotherapy","m":"Embryonal = Early; Alveolar = Adolescent; Pleomorphic = Pensioner."},{"t":"STT","q":"Lecturer pearl: which soft tissue sarcomas commonly spread to lymph nodes?","a":"• Most sarcomas spread **by blood to the lungs** - nodal spread is unusual\n• Exceptions (‘**SCARE**’): **S**ynovial sarcoma, **C**lear
