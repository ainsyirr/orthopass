ive but non-specific and shows no soft tissue.","Correct - MRI is the investigation of choice for early spinal infection.","Wrong - ultrasound cannot image the disc or vertebral marrow."]},{"t":"INF","stem":"A 50-year-old man with MSSA spondylodiscitis of L4/5 has completed 2 weeks of IV cloxacillin. He is now afebrile, his pain is improving, and CRP has fallen from 200 to 40 mg/L. He has no neurological deficit.\nWhat is the most appropriate next step?","o":["Continue IV cloxacillin for a further 10 weeks","Switch to oral therapy to total 6 weeks","Stop antibiotics and mobilise","Add linezolid for resistant cover","Surgical debridement and fusion"],"a":1,"e":"Organism-specific therapy is given for about 6 weeks: 2 weeks IV, then if the patient is improving clinically and biochemically, switch to oral to complete the course. Surgery is reserved for neurological deficit, abscess, instability or failure of medical therapy. Linezolid or daptomycin are for resistant organisms.","w":["Wrong - prolonged IV therapy is unnecessary when responding.","Correct - 2 weeks IV then oral to complete 6 weeks.","Wrong - 2 weeks is too short; relapse risk is high.","Wrong - MSSA is sensitive; resistant cover is not needed.","Wrong - no indication for surgery in a responding patient."]},{"t":"INF","stem":"A 62-year-old man is on day 3 of IV antibiotics for T10/11 spondylodiscitis. He develops bilateral leg weakness (power 3/5), a sensory level at T11 and urinary retention. MRI shows a dorsal epidural collection compressing the cord.\nWhat is the most appropriate management?","o":["Urgent surgical decompression","Change to broader IV antibiotics","CT-guided aspiration of the collection","Rigid thoracolumbar brace and bed rest","High-dose IV dexamethasone alone"],"a":0,"e":"An epidural abscess causing progressive neurological deficit needs urgent surgical decompression and debridement, with antibiotics continued. Spread of infection through the posterior vertebral cortex into the epidural space is the mechanism of cord and cauda equina compression in pyogenic spondylodiscitis.","w":["Correct - progressive deficit from epidural abscess = urgent decompression.","Wrong - antibiotics alone will not relieve mechanical cord compression.","Wrong - percutaneous aspiration is inadequate for a compressing epidural abscess.","Wrong - bracing does not address cord compression.","Wrong - steroids do not treat an infective compressive lesion."]},{"t":"INF","stem":"A 32-year-old man from rural Sabah has 3 months of mid-back pain, night sweats, 6 kg weight loss and evening low-grade fevers. There is a mild angular prominence at the thoracolumbar junction. Radiographs show destruction of the anterior parts of the T9 and T10 bodies with preserved T9/10 disc height and a fusiform paravertebral soft-tissue shadow.\nWhat is the most likely diagnosis?","o":["Pyogenic spondylodiscitis","Tuberculous spondylitis","Metastatic vertebral deposit","Osteoporotic wedge fracture","Multiple myeloma of the spine"],"a":1,"e":"Spinal TB begins in the anterior vertebral body and, early on, spares the disc; it spreads beneath the ligaments to involve adjacent levels and forms a paravertebral (cold) abscess, seen as a fusiform shadow. Constitutional symptoms and gibbus support it. Pyogenic infection destroys the disc early and presents acutely.","w":["Wrong - pyogenic infection destroys the disc early and is acute and toxic.","Correct - anterior body lesion, disc spared, paravertebral abscess, night sweats.","Wrong - metastases usually affect a single body and pedicle without an abscess.","Wrong - there is no fragility history and fever with weight loss suggests infection.","Wrong - myeloma gives punched-out lesions in older adults without a paravertebral abscess."]},{"t":"INF","stem":"A 25-year-old woman on treatment for L1 spinal TB notices a slowly enlarging swelling in the right groin extending below the inguinal ligament. It is fluctuant but not warm, red or tender. Passive extension of the right hip is uncomfortable. She is afebrile.\nWhat is the most likely cause of the swelling?","o":["Inguinal lymphadenitis","Irreducible inguinal hernia","Femoral artery pseudoaneurysm","Psoas cold abscess","Pyogenic iliopsoas abscess"],"a":3,"e":"TB pus from the lumbar spine tracks down the psoas sheath and points in the groin or upper thigh. It is a cold abscess: no heat, redness or marked tenderness, unlike a pyogenic collection. Irritation of psoas makes hip extension painful.","w":["Wrong - TB nodes can be cold but do not track from the spine along psoas.","Wrong - a hernia would have a cough impulse and is not fluctuant pus.","Wrong - a pseudoaneurysm is pulsatile and follows arterial puncture.","Correct - painless, non-inflamed fluctuant swelling tracking along psoas.","Wrong - a pyogenic abscess is hot, tender and the patient is septic."]},{"t":"INF","stem":"A 40-year-old man has biopsy-proven tuberculous spondylitis of T11-T12. He has no neurological deficit and a 20° kyphosis. HIV test is negative and the organism is drug-sensitive.\nWhat is the intensive phase of drug treatment?","o":["RHZE for 2 months","RH for 2 months","RHZE for 6 months","RHZE plus streptomycin for 3 months","IV vancomycin and ceftriaxone for 2 weeks"],"a":0,"e":"Drug-sensitive spinal TB starts with a 2-month intensive phase of rifampicin, isoniazid, pyrazinamide and ethambutol (RHZE). It continues with rifampicin and isoniazid (RH); the slide states 9-18 months, while the Malaysian TB CPG treats bone and joint TB for 6-9 months total, often longer for spinal disease. Streptomycin regimens are not first-line, and vancomycin/ceftriaxone are for pyogenic infection.","w":["Correct - 2 months of four drugs (RHZE) is the intensive phase.","Wrong - RH alone is the continuation phase, not intensive.","Wrong - pyrazinamide and ethambutol are not given for the full 6 months.","Wrong - streptomycin regimens are not first-line for new drug-sensitive TB.","Wrong - this is empirical cover for septic pyogenic infection."]},{"t":"INF","stem":"A 35-year-old man with T8-T9 tuberculous spondylitis has been on anti-TB therapy for 4 weeks. His leg power has worsened from 4/5 to 2/5. MRI shows an anterior epidural abscess with bony debris compressing the cord and a 40° kyphosis.\nWhat is the most appropriate management?","o":["Wide posterior laminectomy without fusion","Continue anti-TB drugs and bed rest","Halo-pelvic traction alone","Percutaneous vertebroplasty","Anterior debridement and strut graft"],"a":4,"e":"Worsening Pott's paraplegia despite therapy and significant kyphosis are indications for surgery. Disease and compression are anterior, so anterior decompression (corpectomy), debridement and strut grafting, often with posterior instrumentation, is the approach. Lecturer pearl: laminectomy alone removes the only intact column and worsens kyphosis and instability.","w":["Wrong - removing posterior elements destabilises an already destroyed anterior column.","Wrong - progressive deficit on adequate therapy needs decompression.","Wrong - traction may be adjunctive but does not decompress the cord.","Wrong - cement into infected bone is contraindicated.","Correct - anterior decompression with strut graft ± posterior fixation."]},{"t":"INF","stem":"A 45-year-old woman has 4 months of thoracolumbar pain and weight loss. ESR is 88 mm/h and Mantoux is 15 mm. MRI shows L1-L2 involvement with a septated paravertebral abscess and subligamentous spread.\nWhich investigation gives the definitive diagnosis?","o":["Erythrocyte sedimentation rate","Chest radiograph","CT-guided biopsy with AFB culture","Interferon-gamma release assay","Contrast-enhanced MRI of the whole spine"],"a":2,"e":"Lymphocytosis, anaemia, raised ESR, a positive Mantoux and typical MRI features support spinal TB but are not diagnostic. Tissue obtained by biopsy for AFB stain, TB culture (with sensitivity) and histology confirms it and excludes tumour or pyogenic infection.","w":["Wrong - ESR is a non-specific marker of inflammation.","Wrong - a chest film may show TB elsewhere but does not prove spinal TB.","Correct - tissue for AFB, culture and histology is definitive.","Wrong - IGRA shows TB exposure, not active spinal disease.","Wrong - MRI is suggestive but cannot exclude tumour or other infection."]},{"t":"PID","stem":"A 35-year-old man develops low back pain after lifting a heavy box, followed by pain radiating down the lateral leg to the dorsum of the foot and great toe. There is weakness of great toe extension and numbness of the first web space. Knee and ankle reflexes are normal.\nWhich nerve root is most likely compressed?","o":["L3 root","L4 root","L5 root","S1 root","L4 and L5 roots"],"a":2,"e":"L5 supplies extensor hallucis longus, sensation over the lateral leg and dorsum of foot, and has no reliable reflex, so normal reflexes fit. L4 reduces the knee jerk and S1 the ankle jerk. A posterolateral L4/5 disc typically compresses the traversing L5 root. Lecturer pearl.","w":["Wrong - L3 affects the anterior thigh and knee jerk.","Wrong - L4 gives medial leg numbness and a reduced knee jerk.","Correct - weak EHL, dorsum of foot numbness, normal reflexes = L5.","Wrong - S1 gives lateral foot numbness, weak plantarflexion and a lost ankle jerk.","Wrong - no L4 features (knee jerk, medial leg) are present."]},{"t":"PID","stem":"A 42-year-old lorry driver has 3 weeks of left sciatica. He has numbness along the lateral border and sole of the left foot, cannot tiptoe on the left, and the left ankle jerk is absent.\nAt which disc level is a posterolateral prolapse most likely?","o":["L5/S1 disc","L4/5 disc","L3/4 disc","L2/3 disc","L4/5 far-lateral disc"],"a":0,"e":"The findings are an S1 radiculopathy. A posterolateral disc compresses the traversing root, so S1 is compressed by the L5/S1 disc. An L4/5 posterolateral disc would affect L5, and an L4/5 far-lateral disc compresses the exiting L4 root.","w":["Correct - posterolateral L5/S1 disc compresses the traversing S1 root.","Wrong - a posterolateral L4/5 disc compresses L5.","Wrong - L3/4 disc compresses L4 (knee jerk).","Wrong - L2/3 disc compresses L3 (anterior thigh).","Wrong - a far-lateral L4/5 disc compresses the exiting L4 root."]},{"t":"PID","stem":"A 40-year-old man with a known L4/5 disc prolapse returns with 2 days of bilateral leg pain, numbness around the anus and no urine passed for 12 hours. A bladder scan shows 900 mL. Anal tone is reduced.\nWhat is the most appropriate next step?","o":["Epidural steroid injection","Analgesia and review in 2 weeks","Outpatient MRI and physiotherapy","Catheterise and discharge home","Urgent MRI and decompression"],"a":4,"e":"Saddle anaesthesia, urinary retention, reduced anal tone and bilateral symptoms indicate cauda equina syndrome, the absolute indication for disc surgery. Catheterise, obtain an urgent MRI and decompress urgently, ideally within 48 hours (Lecturer pearl), to protect bladder, bowel and sexual function.","w":["Wrong - injections do not relieve a massive central compression.","Wrong - delay risks permanent sphincter loss.","Wrong - this is an emergency, not an outpatient problem.","Wrong - catheterisation is needed but discharge misses a surgical emergency.","Correct - cauda equina syndrome: urgent MRI and surgical decompression."]},{"t":"PID","stem":"A 38-year-old woman has 4 weeks of right-sided sciatica. On examination, raising the right leg to 50° reproduces pain below the knee. Raising the straight left leg also reproduces pain in the right leg. There is paraspinal spasm and a list to the left.\nWhich finding is the most specific for a disc herniation compressing a nerve root?","o":["Ipsilateral SLR positive at 50°","Crossed straight leg raise","Positive femoral stretch test","Paraspinal muscle spasm","Lumbar list to one side"],"a":1,"e":"The ipsilateral SLR (pain below the knee at 30-70°) is sensitive but not specific for lower lumbar disc herniation. The crossed SLR, where lifting the unaffected leg reproduces pain in the affected leg, is much less sensitive but highly specific. Spasm and list are non-specific. Lecturer pearl: special-test slides were image-only.","w":["Wrong - ipsilateral SLR is sensitive but less specific.","Correct - crossed SLR is the most specific sign of disc herniation.","Wrong - the femoral stretch test assesses upper lumbar roots (L2-L4).","Wrong - spasm accompanies many causes of back pain.","Wrong - a sciatic list is suggestive but non-specific."]},{"t":"PID","stem":"A 52-year-old man has 2 weeks of pain in the front of the left thigh, weakness of knee extension and a reduced left knee jerk. The straight leg raise is negative bilaterally.\nWhich examination test is most likely to be positive?","o":["Crossed straight leg raise","Spurling's test","Stork test","Femoral stretch test","Adams forward bend test"],"a":3,"e":"Anterior thigh pain, quadriceps weakness and a reduced knee jerk suggest an upper lumbar (L3/L4) root lesion. The SLR tests L5/S1 and is often negative here; the femoral stretch test (prone, knee flexion or hip extension) stretches the femoral nerve roots L2-L4. Lecturer pearl.","w":["Wrong - crossed SLR tests lower lumbar (L5/S1) roots.","Wrong - Spurling's test is for cervical radiculopathy.","Wrong - the stork test detects a pars defect.","Correct - femoral stretch test is positive with L2-L4 root irritation.","Wrong - Adams forward bend test is for scoliosis."]},{"t":"PID","stem":"A 44-year-old man has severe left leg pain. MRI shows a fragment of nucleus pulposus lying behind the L5 vertebral body, completely separated from the L4/5 disc, with no continuity with the parent disc.\nWhich stage of disc herniation is this?","o":["Sequestration","Extrusion","Protrusion","Contained disc bulge","Schmorl's node"],"a":0,"e":"A protrusion bulges with an intact annulus; in an extrusion the annulus is breached but the material stays continuous with the disc; a sequestered fragment has broken free and can migrate in the canal. Sequestered fragments can cause marked pain and neurological symptoms.","w":["Correct - a free fragment separate from the parent disc is sequestration.","Wrong - extruded material remains continuous with the disc.","Wrong - a protrusion has an intact annulus.","Wrong - a contained bulge is a protrusion with no annular breach.","Wrong - a Schmorl's node is herniation through the endplate into the body."]},{"t":"PID","stem":"A 36-year-old man has 10 weeks of severe right S1 sciatica. MRI shows a concordant L5/S1 disc extrusion. Analgesia, physiotherapy and a nerve root steroid injection have failed and he cannot work. Bladder and bowel function are normal and power is stable.\nWhat is the most appropriate next step?","o":["Strict bed rest for 4 weeks","Long-term opioid therapy","L5/S1 spinal fusion","Repeat MRI in 6 months","Microdiscectomy at L5/S1"],"a":4,"e":"Persistent disabling radicular pain despite adequate conservative treatment is a relative indication for discectomy, provided imaging matches the clinical root. Cauda equina syndrome is the only absolute indication. Fusion is not needed for a simple disc herniation without instability.","w":["Wrong - prolonged bed rest is harmful and not effective.","Wrong - long-term opioids are inappropriate for a surgically correctable lesion.","Wrong - fusion is not indicated for a simple disc herniation.","Wrong - further waiting prolongs disability after failed conservative care.","Correct - failed conservative treatment with concordant MRI: discectomy."]},{"t":"SCO","stem":"A 13-year-old premenarchal girl is brought by her mother, who has noticed uneven shoulders. On forward bending there is a right thoracic rib hump. Standing radiograph shows a right thoracic curve with a Cobb angle of 28° and Risser grade 1. Neurological examination is normal.\nWhat is the most appropriate management?","o":["Observation with 6-monthly radiographs","Brace worn over 20 hours a day","Posterior instrumented fusion","Physiotherapy exercises alone","Night-time brace only"],"a":1,"e":"A moderate curve in a growing child (Risser 0-2, premenarchal) has a high risk of progression. Bracing is used for curves of about 20-30° (many guidelines use 25-40°) and must be worn for more than 20 hours a day to halt progression. Exercise maintains muscle tone but does not alter the curve.","w":["Wrong - observation suits curves under 20° or skeletally mature patients.","Correct - growing child, 28° curve: full-time brace over 20 h/day.","Wrong - surgery is for curves above about 45-50°.","Wrong - exercise does not change the curve.","Wrong - part-time wear is insufficient; compliance over 20 h/day determines success."]},{"t":"SCO","stem":"A 15-year-old girl, 2 years after menarche, has a right thoracic curve with a Cobb angle of 55° and Risser grade 4. She is unhappy with her rib prominence and shoulder asymmetry. Neurological examination is normal.\nWhat is the most appropriate management?","o":["Boston brace for 23 hours a day","Observation until skeletal maturity","Milwaukee brace and physiotherapy","Posterior instrumented fusion","Anterior hemivertebra excision"],"a":3,"e":"Curves above about 50° tend to progress even after skeletal maturity and are cosmetically unacceptable, so surgery is indicated. Posterior segmental instrumentation with pedicle screws and rods corrects the curve through the mobile discs. Bracing works only in growing children with moderate curves.","w":["Wrong - bracing does not control a 55° curve near maturity.","Wrong - curves over 50° keep progressing in adulthood.","Wrong - bracing is ineffective at this size and maturity.","Correct - curve over 50° with cosmetic concern: posterior fusion.","Wrong - hemivertebra excision is for congenital scoliosis."]},{"t":"SCO","stem":"A 12-year-old girl is referred after her teacher noticed she stands crookedly. Standing, there is a mild lumbar curve convex to the left. On forward bending the curve disappears and there is no rib or lumbar prominence. Leg lengths are equal and she has no back pain.\nWhat is the most likely diagnosis?","o":["Adolescent idiopathic scoliosis","Compensatory scoliosis","Postural scoliosis","Congenital scoliosis","Sciatic scoliosis"],"a":2,"e":"A curve that disappears on forward bending, with no rotational prominence, is non-structural. With equal leg lengths and no pain, it is postural scoliosis, which usually does not progress. Structural curves, such as idiopathic ones, persist with a rib hump on Adams test.","w":["Wrong - idiopathic scoliosis is structural with a hump on forward bending.","Wrong - compensatory curves need a leg length or pelvic cause.","Correct - disappears on forward bend, equal legs, no pain = postural.","Wrong - congenital curves are structural with vertebral anomalies.","Wrong - sciatic scoliosis is painful, from nerve root irritation."]},{"t":"SCO","stem":"A 10-year-old boy has a lumbar curve on standing examination. There is no rib hump on forward bending. His anterior superior iliac spines are at different heights and his right leg is 2.5 cm shorter after an old femoral fracture.\nWhich manoeuvre best confirms the cause of the curve?","o":["Measure Cobb angle on a standing X-ray","Assess Risser grade on pelvic X-ray","MRI of the whole spine","Re-examine with the patient seated","Bending films towards the convexity"],"a":3,"e":"Compensatory scoliosis results from pelvic tilt due to a short leg or hip disease. Sitting removes the effect of leg length, so the curve disappears when the child sits (or stands on a block). It resolves once the primary problem is corrected.","w":["Wrong - Cobb angle measures size, not the cause.","Wrong - Risser grade assesses skeletal maturity.","Wrong - MRI is not needed for a clear compensatory cause.","Correct - the curve vanishes seated if leg length is the cause.","Wrong - bending films assess curve flexibility for surgery."]},{"t":"SCO","stem":"A 3-year-old boy has a curvature of the spine noted by his parents. There is a tuft of hair over the lower thoracic spine. Radiographs show a hemivertebra at T11 with a 25° curve.\nWhich additional investigation is most important to look for associated anomalies outside the spine?","o":["DEXA scan","Serum creatine kinase","Renal ultrasound","Nerve conduction studies","Isotope bone scan"],"a":2,"e":"Congenital scoliosis from failure of formation (hemivertebra) or segmentation (bar) is commonly associated with renal, cardiac and neurological anomalies, because these develop at the same embryological time. Renal ultrasound and echocardiography are needed, and MRI of the spine for dysraphism. Progressive congenital curves do not respond to bracing.","w":["Wrong - bone density is not the concern in congenital scoliosis.","Wrong - CK screens for muscular dystrophy in neuromuscular curves.","Correct - renal anomalies are commonly associated with hemivertebra.","Wrong - nerve conduction studies do not screen for associated anomalies.","Wrong - a bone scan has no role here."]},{"t":"SCO","stem":"An 11-year-old girl with a right thoracic curve of 18° is reviewed in clinic. She has no back pain and normal neurology.\nWhich finding at this visit most increases her risk of curve progression?","o":["Risser grade 0 and premenarchal","Risser grade 5 on the pelvic radiograph","Menarche three years ago","Curve that corrects on bending","Absence of vertebral rotation"],"a":0,"e":"Progression is driven by remaining growth. Risser grades 0-2 indicate active growth and higher progression risk; 3-5 mean growth is slowing or complete. Premenarchal status also means the pubertal growth spurt is ahead. A fully correcting curve without rotation is non-structural.","w":["Correct - much growth remaining = highest progression risk.","Wrong - Risser 5 means skeletal maturity and low risk.","Wrong - three years after menarche, growth is nearly complete.","Wrong - a curve that corrects is non-structural.","Wrong - no rotation suggests a postural curve that rarely progresses."]},{"t":"SCO","stem":"A 14-year-old boy with spastic quadriplegic cerebral palsy uses a wheelchair. He has a long C-shaped thoracolumbar curve of 50° with pelvic obliquity. He can no longer sit without propping himself on one arm and has an early sacral pressure sore.\nWhat is the most appropriate first step in management?","o":["Boston brace over 20 hours a day","Custom moulded seating support","Hemivertebra resection and fusion","Observation and 6-monthly X-rays","Physiotherapy exercises alone"],"a":1,"e":"Neuromuscular scoliosis typically forms a long C curve that stiffens and causes pelvic obliquity, sitting imbalance and pressure areas. Severe curves with loss of sitting balance are managed first with suitable seating support; if that fails, operative stabilisation is indicated. Treatment depends on functional disability.","w":["Wrong - TLSO bracing is poorly tolerated and does not restore sitting balance.","Correct - seating support first; surgery if it fails.","Wrong - hemivertebra resection is for congenital scoliosis.","Wrong - loss of sitting balance and pressure sores need action.","Wrong - exercise does not alter a neuromuscular curve."]},{"t":"DEG","stem":"A 64-year-old man has 8 months of numb, clumsy hands with difficulty buttoning shirts and writing, and two recent falls from unsteadiness. There is wasting of the hand intrinsics, brisk reflexes in all four limbs, thumb flexion on flicking the middle finger nail, and upgoing plantars.\nWhat is the most likely diagnosis?","o":["Bilateral carpal tunnel syndrome","Cervical radiculopathy","Peripheral polyneuropathy","Lumbar spinal stenosis","Cervical spondylotic myelopathy"],"a":4,"e":"Loss of hand dexterity, gait imbalance and upper motor neurone signs (hyperreflexia, Hoffmann, Babinski) indicate cord compression: cervical myelopathy, commonly from spondylosis. Radiculopathy gives dermatomal arm pain and reduced reflexes at one level. MRI confirms; progressive myelopathy needs surgical decompression.","w":["Wrong - carpal tunnel causes no UMN signs or gait disturbance.","Wrong - radiculopathy gives LMN signs (reduced reflexes) in one root.","Wrong - neuropathy reduces reflexes rather than making them brisk.","Wrong - lumbar stenosis cannot produce hand or UMN upper limb signs.","Correct - clumsy hands, falls and UMN signs = cord compression."]},{"t":"DEG","stem":"A 50-year-old woman has neck pain radiating to the lateral forearm and thumb, with numbness of the thumb and index finger. Elbow flexion and wrist extension are weak and the biceps and brachioradialis reflexes are reduced. Extending and rotating her neck to the right with axial pressure reproduces the arm pain.\nWhich nerve root is most likely affected?","o":["C5 root","C7 root","C8 root","T1 root","C6 root"],"a":4,"e":"A positive Spurling's test with dermatomal pain and LMN signs indicates cervical radiculopathy. C6 supplies the thumb and index finger, elbow flexion and wrist extension, and the biceps and brachioradialis reflexes. C7 affects the middle finger and triceps reflex. Lecturer pearl.","w":["Wrong - C5 affects the shoulder (deltoid) and lateral upper arm.","Wrong - C7 affects the middle finger, triceps and triceps reflex.","Wrong - C8 affects the little finger and finger flexors.","Wrong - T1 affects the medial arm and hand intrinsics.","Correct - thumb, wrist extension, biceps and brachioradialis reflex = C6."]},{"t":"DEG","stem":"A 72-year-old man has a year of bilateral buttock and thigh heaviness after walking about 200 m. He has to sit down or lean forward on a shopping trolley for relief, but can cycle for 30 minutes without symptoms. Pedal pulses are palpable and ABPI is 1.0. Neurological examination at rest is normal.\nWhat is the most likely diagnosis?","o":["Peripheral arterial disease","Lumbar spinal stenosis","Acute lumbar disc prolapse","Bilateral hip osteoarthritis","Diabetic peripheral neuropathy"],"a":1,"e":"Neurogenic claudication is relieved by sitting or flexing forward (the shopping-trolley sign), because flexion enlarges the canal; cycling in flexion is tolerated. Vascular claudication eases on simply standing still, is unaffected by posture, and comes with weak pulses and a low ABPI. Always check peripheral pulses.","w":["Wrong - normal pulses and ABPI and relief with flexion exclude vascular claudication.","Correct - posture-dependent leg symptoms with normal pulses = neurogenic claudication.","Wrong - an acute disc gives sudden radicular pain, not walking-induced claudication.","Wrong - hip OA causes groin pain on movement, not relieved by leaning forward.","Wrong - neuropathy gives constant distal symptoms unrelated to walking."]},{"t":"DEG","stem":"A 70-year-old woman has neurogenic claudication limiting her walking to 100 m despite 6 months of analgesia and physiotherapy. Pedal pulses are normal. Surgery is being considered.\nWhich investigation is the gold standard to confirm the diagnosis and plan surgery?","o":["Ankle-brachial pressure index","Lateral lumbar radiograph","MRI of the lumbar spine","Nerve conduction studies","Lower limb arterial duplex"],"a":2,"e":"MRI is the gold standard for lumbar spinal stenosis, showing the level and cause of compression (disc, facet hypertrophy, ligamentum flavum, slip). Plain radiographs show disc narrowing and osteophytes but not neural compression. Vascular tests are for excluding arterial claudication, which normal pulses already make unlikely.","w":["Wrong - ABPI assesses arterial disease, not neural compression.","Wrong - radiographs show bony degeneration but not canal narrowing.","Correct - MRI defines the level and severity of stenosis.","Wrong - nerve studies do not image the canal.","Wrong - duplex is for vascular claudication."]},{"t":"DEG","stem":"A 60-year-old man has 6 months of worsening hand clumsiness and an unsteady gait. Examination shows hyperreflexia and a positive Hoffmann sign. MRI shows C5/6 disc-osteophyte compression of the cord with high T2 signal within the cord.\nWhat is the most appropriate management?","o":["Anterior cervical discectomy and fusion","Soft cervical collar and physiotherapy","Cervical traction and NSAIDs","Interlaminar cervical epidural steroid injection","Spinal manipulation and posture advice"],"a":0,"e":"Cervical myelopathy is usually progressive, and cord signal change indicates established damage, so surgical decompression is indicated to halt deterioration. Anterior cervical discectomy and fusion suits one- or two-level anterior compression; laminoplasty is used for multilevel disease. Conservative measures are for axial pain or mild radiculopathy.","w":["Correct - progressive myelopathy with cord compression: decompress (ACDF).","Wrong - a collar does not stop progressive myelopathy.","Wrong - traction risks the compressed cord and does not decompress it.","Wrong - injections treat radicular pain, not myelopathy.","Wrong - manipulation is dangerous with cord compression."]},{"t":"DEG","stem":"A 68-year-old woman has mild neurogenic claudication and can walk about 800 m before needing to sit. She has no neurological deficit and no bladder symptoms. MRI shows moderate L4/5 spinal stenosis without instability.\nWhat is the most appropriate initial management?","o":["Posterior decompressive laminectomy","Decompression with instrumented fusion","Undercutting facetectomy at L4/5","Analgesia and non-impact exercise","Strict bed rest and lumbar corset"],"a":3,"e":"Mild stenosis without deficit is managed conservatively first: education, analgesia/NSAIDs, a non-impact exercise programme, aerobic fitness, activity modification and epidural steroid injection. Posterior decompression (with fusion only if unstable) is for failed conservative care or progressive disability.","w":["Wrong - surgery is for failed conservative care or disabling symptoms.","Wrong - fusion is added only when there is instability.","Wrong - this is a surgical decompression technique, premature here.","Correct - conservative care first for mild stenosis.","Wrong - bed rest deconditions and is not recommended."]}]},{"id":"paeds","title":"Paediatric Orthopaedics","short":"Paeds","emoji":"🧒","source":"Common Paedeatric Orthopedic Disorder_20260723_081011_0000.pdf","topics":{"PHY":"Physis & Salter-Harris fractures","SCH":"Supracondylar humerus fracture","GRT":"Greenstick & torus (buckle) fractures","NAI":"Non-accidental injury","CTEV":"Clubfoot / CTEV","FLAT":"Pes planus, congenital vertical talus, tarsal coalition","INT":"Intoeing: metatarsus adductus, tibial torsion, femoral anteversion","LCP":"Legg-Calvé-Perthes disease","SCFE":"Slipped capital femoral epiphysis","DDH":"Developmental dysplasia of the hip","BLT":"Blount disease"},"cards":[{"t":"PHY","q":"Name the zones of the physis from the epiphyseal side to the metaphyseal side, and what each does.","a":"• **Resting (reserve) zone** – nearest the epiphysis; stores nutrients, houses the **germinal matrix** and inactive chondroblasts\n• **Proliferative zone** – active chondroblasts divide rapidly (mitosis) and make ECM\n• **Hypertrophic zone** – chondrocyte maturation, degeneration and provisional calcification\n• Then the metaphysis (new bone)","m":"R-P-H = Rest, Proliferate, Hypertrophy – the cells’ life story from epiphysis to metaphysis."},{"t":"PHY","q":"Which zone of the physis is the weakest, and why does that matter?","a":"• The **hypertrophic zone** (zone of provisional calcification)\n• Large cells with little matrix and incomplete calcification = mechanically weak\n• **Most physeal separations** pass through this layer\n• Germinal (resting) cells usually stay with the epiphysis, so simple separations (SH I/II) grow normally","m":"Lecturer pearl: Hypertrophic = Hyper-fragile. Big swollen cells, thin walls."},{"t":"PHY","q":"What does the SALTR mnemonic stand for in the Salter-Harris classification?","a":"• **I – S**lipped / Straight across: physis only\n• **II – A**bove: physis + **metaphysis**\n• **III – L**ower: physis + **epiphysis**\n• **IV – T**hrough: metaphysis + physis + epiphysis\n• **V – R**ammed / eRased: crush of the physis","m":"Lecturer pearl: SALTR. Above = towards the shaft (metaphysis), Lower = towards the joint (epiphysis)."},{"t":"PHY","q":"What is the most common Salter-Harris type, and what is its metaphyseal fragment called?","a":"• **Type II** – about **75%** of physeal fractures\n• Fracture runs across most of the physis then exits **up through the metaphysis**\n• Metaphyseal triangle = **Thurston-Holland fragment**\n• Periosteum intact on the fragment side helps closed reduction; occasionally trapped periosteum blocks reduction and needs open reduction\n• Good prognosis","m":"Thurston-Holland: the little Triangle Hanging on the shaft side."},{"t":"PHY","q":"Salter-Harris type I: what are its features and why can the X-ray look normal?","a":"• **Transverse separation through the physis only**\n• If periosteum intact → **no displacement**, so X-ray may be normal or show only physeal widening\n• Torn periosteum → may displace\n• **Rapid healing** (2-3 weeks), **good prognosis**\n• Clinical clue: point tenderness over the physis","m":"Tender physis + normal film = treat as SH I until proven otherwise."},{"t":"PHY","q":"Why does a Salter-Harris type III fracture carry a poorer prognosis, and what is the classic example?","a":"• Fracture runs through the physis then **down through the epiphysis** into the joint = **intra-articular**\n• Crosses the **proliferative and reserve zones** → growth disturbance risk\n• Joint step → **post-traumatic arthritis**\n• Classic example: **juvenile Tillaux fracture** (anterolateral distal tibial epiphysis)","m":"Lecturer pearl: Tillaux happens because the distal tibial physis closes medial-first, leaving the anterolateral corner to be avulsed by the AITFL."},{"t":"PHY","q":"Salter-Harris type IV: what does it cross and what is the classic example?","a":"• Crosses **metaphysis + physis + epiphysis** (vertical split through all three)\n• Intra-articular → **post-traumatic arthritis**\n• Bridges the physis → **bony bar** → **growth disturbance** (angular deformity/shortening)\n• Classic example: **triplane fracture** of the distal tibia\n• Needs anatomical reduction (ORIF)","m":"Triplane = three planes = Type IV goes Through all three layers."},{"t":"PHY","q":"Salter-Harris type V: why is it the worst prognosis and how is it usually diagnosed?","a":"• **Compression/crush** of the growth plate (axial load)\n• Destroys the **germinal matrix and its blood supply** → growth arrest\n• **X-ray often normal** at presentation; rare\n• Usually diagnosed **retrospectively** when shortening or angular deformity appears","m":"V = Vanished growth: you only see it when the limb stops growing."},{"t":"PHY","q":"How are Salter-Harris fractures managed by type?","a":"• **Types I and II**: **closed reduction** + cast/splint **4-6 weeks** + follow-up for growth disturbance (about 3 months and beyond)\n• **Types III and IV**: **ORIF** – intra-articular, needs **anatomical reduction** of joint surface and physis; immobilise 4-8 weeks after surgery\n• Avoid repeated forceful manipulation (damages physis)","m":"I and II: Close it. III and IV: Open it (joint + physis both need to line up)."},{"t":"PHY","q":"What are the complications of physeal fractures and how does growth disturbance occur?","a":"• **Growth disturbance** – a **physeal bar** (bone bridge) tethers growth\n  – central/complete bar → **limb shortening**\n  – peripheral/partial bar → **angular deformity**\n• **Post-traumatic arthritis** (types III/IV)\n• Prolonged pain, restricted mobility\n• Physeal fractures = **15-30%** of all children’s bony injuries","m":"A bar is like a staple on one side of a growing book spine – it bends as the rest grows."},{"t":"SCH","q":"What are the two mechanisms of supracondylar humerus fracture and their relative frequencies?","a":"• **Extension type (~95%)** – **FOOSH** with elbow hyperextended; **distal fragment displaced posteriorly**\n• **Flexion type (~5%)** – direct blow on the **flexed elbow**; distal fragment displaced anteriorly\n• Peak in children **under 10 years**","m":"95% fall forwards on an outstretched hand; 5% land on the point of the bent elbow."},{"t":"SCH","q":"What are the clinical features of a displaced supracondylar fracture?","a":"• Pain, **swelling**, reduced elbow ROM\n• **S-shaped deformity** of the elbow\n• **Bruising over the antecubital fossa** (pucker sign – proximal spike buttonholed through brachialis)\n• Neurovascular involvement: ~**15% neuropathy** and ~**5% vascular compromise** in Gartland III\n• Always document **radial pulse, perfusion and AIN/radial/ulnar function** before and after treatment","m":"Antecubital pucker = the bone spike has punched towards the brachial artery and median nerve."},{"t":"SCH","q":"Which radiographs and radiological lines/angles are used in a suspected supracondylar fracture?","a":"• **AP + lateral elbow** X-ray\n• **Lateral** – clearest view: **fat pad (sail) sign**, **anterior humeral line** (should pass through the middle third of the capitellum; passes anterior to it in extension type)\n• **AP** – **Baumann’s angle** (shaft vs lateral condylar physis) to judge coronal alignment/varus\n• Note: slide says ‘Baunmann’; correct is **Baumann**","m":"Lateral = displacement (anterior humeral line); AP = alignment (Baumann)."},{"t":"SCH","q":"What does a visible posterior fat pad on an elbow lateral X-ray mean?","a":"• Posterior fat pad normally hidden in the olecranon fossa\n• If **visible** → **joint effusion/haemarthrosis** lifting it\n• In a child after trauma = **occult fracture** (usually undisplaced supracondylar) until proven otherwise\n• Raised anterior fat pad = **sail sign**\n• Treat as Gartland I: above-elbow backslab, review","m":"Lecturer pearl: a posterior fat pad is never normal – the effusion has pushed it out of hiding."},{"t":"SCH","q":"Describe the modified Gartland classification of extension-type supracondylar fractures.","a":"• **I** – undisplaced or displaced **< 2 mm**\n• **IIA** – displaced > 2 mm, **posterior cortex intact** (hinged)\n• **IIB** – posterior cortex intact but **malrotation**/translation\n• **III** – **completely displaced**, no cortical contact\n• **IV** – complete displacement with **multidirectional instability** (periosteal hinge lost)\n• Note: slide says ‘Gartlannd’; correct is **Gartland**","m":"Hinge present = II, hinge gone = III, hinge gone in every direction = IV."},{"t":"SCH","q":"How is a supracondylar fracture managed according to Gartland type?","a":"• **Type I**: above-elbow cast/backslab at **90°** + sling, **3-4 weeks**\n• **Type II**: **closed manipulative reduction (CMR) under GA** + above-elbow cast; if unstable → **CRPP**\n• **Type III/IV**: **closed reduction + percutaneous K-wire pinning (CRPP)**\n• **Open reduction** if CMR fails, **open fracture** or **vascular injury**","m":"Gartland I cast, II reduce, III/IV pin, open if failed/open/vessel."},{"t":"SCH","q":"Which nerves are injured in supracondylar fractures, and how do you test the commonest one?","a":"• **Anterior interosseous nerve (AIN)** – commonest in **extension type** (posterolateral displacement) → cannot make the **OK sign** (FPL + FDP index); no sensory loss\n• **Radial nerve** – posteromedial displacement\n• **Ulnar nerve** – **flexion type** and **iatrogenic medial pin**\n• Most are neurapraxias and recover","m":"Lecturer pearl: Extension = AIN (OK sign fails); Flexion and medial pin = Ulnar."},{"t":"SCH","q":"What is the management of a ‘pink pulseless hand’ after a displaced supracondylar fracture?","a":"• Pink, warm, good capillary refill but **no palpable radial pulse** = collateral perfusion\n• **Urgent closed reduction and percutaneous pinning** (reduction often frees a kinked brachial artery)\n• **Reassess** perfusion after reduction\n• Explore brachial artery if the hand becomes or remains **white/poorly perfused**\n• Admit for close neurovascular/compartment monitoring","m":"Lecturer pearl: Fix the bone first, then look at the hand again. White pulseless = emergency reduction ± exploration."},{"t":"SCH","q":"What is Volkmann ischaemic contracture and how is it prevented?","a":"• End result of untreated **forearm compartment syndrome** (deep flexors, FDP/FPL) after brachial artery injury or swelling\n• Early warning: **pain out of proportion**, **pain on passive finger extension**, tense forearm, increasing analgesia need – pulse may be present\n• Late: fixed flexion of wrist/fingers, sensory loss\n• Prevent: avoid elbow flexion > 90° in a swollen limb, split dressings, **urgent fasciotomy**","m":"Lecturer pearl: Pain on stretching the fingers is the earliest and most reliable sign – pulselessness is late."},{"t":"SCH","q":"What is the commonest late complication of supracondylar fracture and why does it happen?","a":"• **Cubitus varus (gunstock deformity)**\n• Caused by **malunion** – medial tilt/collapse and **internal rotation** of the distal fragment (not growth arrest)\n• Mainly **cosmetic**; function usually good\n• Correct with **lateral closing-wedge (supracondylar) osteotomy** if disfiguring\n• Other late complications: cubitus valgus, **elbow stiffness**","m":"Lecturer pearl: Gunstock = the elbow looks like a rifle butt; check Baumann’s angle at reduction to prevent it."},{"t":"GRT","q":"What is a greenstick fracture and where does it occur?","a":"• **Incomplete fracture**: cortex and periosteum broken on the **tension (convex) side**, intact on the compression side\n• Occurs in the **diaphysis and metaphysis**, never the physis (that is Salter-Harris)\n• Commonest in long bones – **forearm and arm**\n• Causes: FOOSH, sports, **non-accidental trauma**","m":"Like bending a fresh green twig – one side snaps, the other bends."},{"t":"GRT","q":"Why do children get greenstick and torus fractures rather than complete fractures?","a":"• Children’s bone is more **porous and elastic** (lower mineral content)\n• **Thick, strong periosteum** holds the fragments\n• So bone **bends or buckles** before it breaks through both cortices\n• Thick periosteum also gives **rapid healing** and **remodelling**","m":"Child bone = green wood; adult bone = dry stick."},{"t":"GRT","q":"What is a torus (buckle) fracture, its mechanism and typical site?","a":"• **Incomplete fracture without a cortical break** – the cortex **bulges/buckles**\n• Mechanism: **axial compression** along the bone → compression side buckles\n• Typical site: **distal radial metaphysis** after FOOSH\n• ‘Torus’ = Latin for **protuberance/swelling**\n• **Stable** injury","m":"Torus = the bulge at the base of a classical column: squash a drinking straw end-on and it bulges."},{"t":"GRT","q":"Greenstick vs torus fracture: how does immobilisation differ?","a":"• **Torus**: stable → **splint for 3-4 weeks**, no reduction needed\n• **Greenstick**: angulated and potentially unstable → **closed manipulative reduction (CMR) + cast ~6 weeks**\n• Lecturer pearl: some surgeons complete the greenstick fracture during reduction to stop the intact cortex springing the angulation back","m":"Buckle = splint and go; Greenstick = straighten and cast."},{"t":"NAI","q":"What is non-accidental injury (NAI), and what is its commonest presentation?","a":"• Child maltreatment by an act of a **parent or caretaker** causing injury that is **not accidental**\n• Also called paediatric physical abuse / inflicted injury\n• **Skin and soft tissue injury (bruises, burns)** = commonest presentation\n• About **one-third** of NAI cases have **fractures**","m":"Skin first, bones in one-third."},{"t":"NAI","q":"Which features of the history should raise suspicion of NAI?","a":"• **Delay** in seeking medical care\n• **History inconsistent** with the injury or the child’s development (changing story)\n• Injury in a **non-ambulatory** child\n• **Multiple fractures** with no family history of **osteogenesis imperfecta**\n• Social risks: substance abuse, mental illness, financial or domestic stress","m":"Delay, Discrepancy, Development (can’t walk), Different ages of injury."},{"t":"NAI","q":"Which fractures are most specific for child abuse?","a":"• **Metaphyseal corner (bucket-handle) fractures** – shaking/twisting of limbs in infants\n• **Posterior rib fractures** – squeezing the chest (rarely from CPR)\n• Also highly specific: **scapular, sternal**, spinous process fractures\n• Others suspicious: **fractures of different ages**, femur fracture before walking age, spiral long-bone fracture in a non-walker","m":"Lecturer pearl: Corners and posterior ribs = classic abuse. Clavicle and simple skull fractures are much less specific."},{"t":"NAI","q":"Why is a femoral fracture in a child who cannot yet walk a red flag?","a":"• Non-walkers cannot generate the force for a femoral fracture by themselves\n• Accidental femoral fractures need significant trauma (e.g. road traffic accident) with a matching history\n• So **femur fracture before walking age** = suspect NAI → full work-up\n• Lecturer pearl: a toddler’s spiral tibial fracture in a new walker is usually accidental","m":"If they don’t cruise, they don’t break a femur."},{"t":"NAI","q":"What neurological findings suggest abusive head trauma in an infant?","a":"• **Retinal haemorrhages** (especially multilayered, extensive)\n• **Altered mental status** – irritability, drowsiness, seizures, vomiting\n• Subdural haemorrhage on imaging\n• Investigate with **CT head**; fundoscopy by ophthalmology","m":"Shaken infant triad (Lecturer pearl): subdural + retinal haemorrhage + encephalopathy."},{"t":"NAI","q":"Which blood tests are done in suspected NAI and why?","a":"• **FBC (platelets) + coagulation profile (PT, APTT, INR)** if any **bruising or intracranial haemorrhage** – exclude a bleeding disorder mimic\n• **LFT, amylase, lipase** – screen for **occult intra-abdominal injury**\n• (Guidelines for the Hospital Management of Child Abuse and Neglect, 2009)","m":"Clot screen for the bruises, liver/pancreas screen for the belly."},{"t":"NAI","q":"What imaging is used to investigate suspected NAI?","a":"• **Skeletal survey in children < 2 years** (occult fractures)\n• **Targeted plain radiographs if > 2 years**\n• **CT head** – suspected intracranial injury\n• **MRI** – chronic lesions and early ischaemic injury\n• Look for fractures of **different stages of healing**","m":"Under 2 = survey everything; over 2 = X-ray what hurts."},{"t":"NAI","q":"What is the Malaysian hospital management pathway for suspected child abuse?","a":"• **Activate the SCAN team** (Suspected Child Abuse and Neglect)\n• Triage and **stabilise** in ED; refer to relevant specialties\n• **Lodge a police report**, refer to SCAN and **notify JKM** (Jabatan Kebajikan Masyarakat – Social Welfare Department)\n• **Admit** the child (place of safety)\n• **Document** all findings, obtain consent for examination/treatment, prepare the **medical report**","m":"SCAN – Police – JKM – Admit – Document."},{"t":"CTEV","q":"Define congenital talipes equinovarus (CTEV).","a":"• Congenital foot deformity with a **fixed resting equinovarus** position\n• **Congenital** – present from birth\n• **Talipes** – ankle (talus) + foot (pes)\n• **Equino** – heel elevated (plantarflexed)\n• **Varus** – heel/foot turned inwards\n• Not passively correctable (unlike positional talipes)","m":"Equinus = horse standing on tip-toe; varus = turned in."},{"t":"CTEV","q":"What are the epidemiology and risk factors for CTEV?","a":"• **1 in 250 to 1 in 1000** live births\n• **~50% bilateral**\n• **Boys : girls = 2 : 1**\n• Causes/risks: **idiopathic** (most), **genetic predisposition**, **neuromuscular** disorders (e.g. spina bifida, arthrogryposis), **tight intrauterine packing**","m":"Half bilateral, boys twice as often."},{"t":"CTEV","q":"What does CAVE stand for in clubfoot, and which tight structures cause each part?","a":"• **C – Cavus**: high medial arch at midfoot – tight **intrinsics, FHL, FDL**\n• **A – Adductus**: forefoot adducted at tarsometatarsal joints – tight **tibialis posterior**\n• **V – Varus**: heel inverted at the talocalcaneonavicular joint – tight **tendo Achilles, tibialis posterior, tibialis anterior**\n• **E – Equinus**: ankle plantarflexed – tight **tendo Achilles**","m":"You enter the CAVE in order – which is also the order Ponseti corrects it."},{"t":"CTEV","q":"What are the clinical signs of clubfoot on examination?","a":"• **Medial skin crease** (midfoot) and **posterior skin crease** (heel)\n• **Empty heel** – calcaneus pulled up\n• **Small foot and calf**, **shortened tibia** (persist even after treatment)\n• Rigid – cannot be passively corrected\n• Examine **spine and hips** for neuromuscular causes/DDH","m":"Lecturer pearl: always counsel parents that the foot and calf stay slightly smaller even after perfect correction."},{"t":"CTEV","q":"Describe the bony pathoanatomy of clubfoot.","a":"• **Talar neck points downward and medially**\n• **Navicular and cuboid** shifted medially and **supinated**\n• **Calcaneus in varus**, rotated medially **around/under the talus**\n• The whole foot is rotated inwards around a relatively fixed talus","m":"The foot has spun inwards around the talus – so treatment spins it back outwards around the talar head."},{"t":"CTEV","q":"What is the Pirani score?","a":"• Clinical score of severity and treatment progress: **6 signs, each 0, 0.5 or 1** (total **0-6**)\n• **Midfoot (MFCS)**: medial crease, curved lateral border, lateral head of talus palpable\n• **Hindfoot (HFCS)**: posterior crease, empty heel, rigid equinus\n• Severity: **1-2 mild, 3-4 moderate, 5-6 severe**","m":"3 + 3 signs: midfoot curves and creases; hindfoot crease, empty heel and stiff ankle."},{"t":"CTEV","q":"What investigations are used in CTEV?","a":"• **Clinical diagnosis** – X-ray not routinely done\n• X-ray if atypical, rigid, late presenter or to exclude other diagnoses\n  – AP: **talocalcaneal (Kite) angle < 20°** (normal 20-40°), negative talus-first metatarsal angle, **hindfoot parallelism**\n  – Dorsiflexion lateral (**Turco view**): talocalcaneal angle **< 25°**, parallelism\n• **Antenatal ultrasound** from ~12 weeks – **high false-positive rate**","m":"Clubfoot = talus and calcaneus lie parallel (small Kite angle)."},{"t":"CTEV","q":"What is the principle of the Ponseti method and how successful is it?","a":"• Serial weekly **manipulation and long-leg casting** from the first weeks of life\n• Principle: rotate (abduct) the foot **laterally around a fixed talus**, using the **talar head as the fulcrum**\n• Correction phase → Achilles tenotomy if needed → **maintenance bracing**\n• **> 90%** of idiopathic clubfeet achieve initial correction","m":"Ponseti: thumb on the talar head, swing the foot outwards like a door on its hinge."},{"t":"CTEV","q":"In what order does Ponseti casting correct the deformity, and what must never be done?","a":"• **C → A → V → E**\n• **Cavus**: elevate (dorsiflex) the **first ray** – forefoot supinated to align with hindfoot\n• **Adductus + varus**: abduct the foot around the **talar head** (heel varus corrects with it)\n• **Equinus last**: dorsiflex ankle ± tenotomy\n• **Never pronate** the forefoot (worsens cavus); never press on the calcaneus","m":"Lecturer pearl: Pronation is the enemy – it makes the cavus worse. Equinus is always LAST."},{"t":"CTEV","q":"When is a percutaneous Achilles tenotomy indicated in Ponseti treatment?","a":"• When cavus, adductus and varus are corrected (foot abducted ~60-70°) but **ankle dorsiflexion is still < 10-15°**\n• Pirani terms: **midfoot score corrected (≤ 0.5-1)** but **hindfoot score still > 1**\n• Needed in about **80-90%** of feet\n• Followed by a final cast for **3 weeks**, then bracing","m":"Lecturer pearl: Midfoot fixed, hindfoot still stiff → cut the heel cord."},{"t":"CTEV","q":"How is correction maintained after Ponseti casting?","a":"• **Foot abduction orthosis (FAO)** – **Denis Browne boots and bar**\n• **23 hours a day for 3 months**, then **nights and naps until about 4 years**\n• Affected foot externally rotated ~60-70° (normal side ~40°), bar shoulder-width\n• Note: slide says ‘Dennis Brown boots’; correct is **Denis Browne** (foot abduction orthosis)","m":"Lecturer pearl: 23 hours x 3 months, then sleep-time until 4. The boots keep what the casts gained."},{"t":"CTEV","q":"What is the commonest cause of clubfoot relapse and how is it managed?","a":"• **Non-compliance with bracing** – the main cause, especially < 2 years\n• Relapse < 2 years: **repeat Ponseti casting** ± repeat tenotomy, then resume FAO\n• Older child with **dynamic supination**: **tibialis anterior tendon transfer** (lateral)\n• Resistant/recurrent deformity → surgical release","m":"Lecturer pearl: Relapse = Remove the boots too early."},{"t":"CTEV","q":"What are the indications and options for operative treatment of clubfoot?","a":"• Indications: **resistant/recurrent deformity**, **syndromic clubfoot**, **delayed presentation > 1-2 years**\n• Aim: release capsular/ligamentous tethers and lengthen tendons\n• Options: **posteromedial soft-tissue release** + tendon lengthening, **osteotomy** (medial column lengthening/lateral column shortening, supramalleolar), **triple arthrodesis** (older child), **Taylor Spatial Frame**, **talectomy**","m":"Ponseti first; surgery for the Resistant, the Syndromic and the Late."},{"t":"CTEV","q":"What are the complications of conservative and surgical treatment of clubfoot?","a":"• **Conservative**: deformity **relapse**, **dynamic supination**, **rocker-bottom foot** (forcing dorsiflexion through the midfoot against a tight Achilles)\n• **Surgical**: residual cavus, **pes planus**, undercorrection, **intoeing gait**, **osteonecrosis of the talus**, **dorsal bunion**\n• Extensive surgical release → stiff, painful foot in adulthood","m":"Rocker-bottom = the midfoot ‘broke’ because the heel cord was not released first."},{"t":"FLAT","q":"Define pes planus (flat foot).","a":"• Collapse of the **medial longitudinal arch**\n• **Hindfoot (subtalar) valgus**\n• **Forefoot abduction**\n• **Medial talar head prominence**\n• Types: **flexible** (most) vs **rigid** (congenital vertical talus, tarsal coalition)","m":"Flat arch, heel out, forefoot out, talar head bulging in."},{"t":"FLAT","q":"How common is flat foot in children and why?","a":"• **~90% of children < 2 years** have flat feet (medial fat pad + **ligamentous laxity**)\n• Arch develops through childhood; laxity usually resolves after ~7 years\n• **20-37%** of the population have some degree of pes planus\n• **Most cases are flexible**","m":"Toddlers are born flat-footed – the arch is learned, not built-in."},{"t":"FLAT","q":"How do you distinguish a flexible from a rigid flat foot clinically?","a":"• **Tip-toe test**: in flexible flat foot the **heel inverts and the arch forms**\n• **Jack’s test**: passive **great toe extension restores the arch** (windlass mechanism)\n• Flexible foot is flat **only when standing**\n• **Rigid**: arch does not reconstitute, **subtalar motion limited** → think **tarsal coalition** or **congenital vertical talus**","m":"Arch appears on tip-toe = flexible = usually fine. No arch on tip-toe = rigid = find the cause."},{"t":"FLAT","q":"How is a flexible flat foot in a child managed?","a":"• Usually **asymptomatic** → **reassure and observe**\n• Check for **ligamentous laxity** (e.g. Marfan, collagen disorders) and a **tight tendo Achilles** (growth spurts)\n• **Stretching** if TA tight; **shoe modification** with good medial arch support if symptomatic\n• **Imaging only if painful**: standing AP and lateral foot","m":"Lecturer pearl: painless flexible flat foot = reassure. Pain or stiffness = investigate."},{"t":"FLAT","q":"What is congenital vertical talus and what are its clinical features?","a":"• Rare **rigid** flat foot (**rocker-bottom foot**); ~50% bilateral\n• Irreducible **dorsal dislocation of the navicular** on the talar neck; **talus vertical**, calcaneus in equinus\n• Sole **convex** (arch curves the opposite way), foot in **valgus**, **prominent talar head** in the sole\n• ‘Peg-leg’ / calcaneal gait\n• Associated **neuromuscular/chromosomal** disease (cerebral palsy, spinal muscular atrophy), **HOXD10** mutation","m":"Rocker-bottom: the sole curves like the base of a rocking chair."},{"t":"FLAT","q":"Which X-ray confirms congenital vertical talus and what does it show?","a":"• **Forced plantarflexion lateral view** – talus **stays vertical** and the **navicular stays dorsally dislocated** (irreducible)\n• Lateral: **calcaneus in equinus**, talus pointing into the sole\n• AP: **talocalcaneal angle > 40°** (normal 20-40°)\n• Contrast: **oblique talus** reduces on plantarflexion","m":"Lecturer pearl: Plantarflex it – if the talus won’t line up with the first metatarsal, it’s vertical talus."},{"t":"FLAT","q":"How is congenital vertical talus treated?","a":"• **Conservative**: passive stretching and **reverse Ponseti** serial casting (foot held in plantarflexion and inversion – the opposite of clubfoot), then **foot abduction orthosis**, switching to **AFO** once weight bearing\n• **Surgical**: **full peritalar soft-tissue release**; **talectomy** when necessary; **navicular excision** in the older child\n• Note: slide says ‘reverse ponti’; correct is **reverse Ponseti**","m":"Clubfoot = Ponseti; vertical talus = reverse Ponseti (cast it into the clubfoot direction)."},{"t":"FLAT","q":"What is tarsal coalition and how does it present?","a":"• Congenital **failure of segmentation** of tarsal bones (fibrous, cartilaginous or bony bar)\n• Commonest: **calcaneonavicular**, then **talocalcaneal**; **50% bilateral**; may be more than one per foot\n• Presents in late childhood/adolescence as the bar ossifies: **painful rigid flat foot**, recurrent ankle sprains\n• Exam: hindfoot valgus, forefoot abduction, **limited subtalar motion**, heel cord contracture, **arch does not reform on tip-toe**","m":"Lecturer pearl: teenager + ‘recurrent sprains’ + stiff flat foot = look for a coalition."},{"t":"FLAT","q":"Which imaging identifies a tarsal coalition and how is it treated?","a":"• X-rays: AP, standing lateral, **45° internal oblique** (calcaneonavicular bar; lateral shows the **anteater sign**), **Harris axial view** (talocalcaneal bar)\n• **CT/MRI more accurate** – CT defines bar size\n• Conservative: **below-knee walking cast for 6 weeks**\n• Surgery: **bar excision** (relieves pain, does not restore movement); **arthrodesis** if talocalcaneal bar **> 50% of posterior facet** or degenerative change","m":"Lecturer pearl: Anteater sign = elongated anterior process of calcaneus reaching for the navicular like an anteater’s nose."},{"t":"INT","q":"What is intoeing, and what are its three causes by anatomical level?","a":"• Feet point inwards when walking/running (**pigeon-toed**), often noticed when walking starts\n• **Foot**: metatarsus adductus\n• **Leg**: internal tibial torsion\n• **Thigh**: increased femoral anteversion\n• Risk: overweight children, early walkers, girls","m":"Work up the limb: foot → tibia → femur."},{"t":"INT","q":"Which cause of intoeing is typical at each age?","a":"• **Infant (< 1 y)**: **metatarsus adductus**\n• **Toddler (1-3 y)**: **internal tibial torsion**\n• **Child (3-8 y)**: **femoral anteversion**\n• Most resolve spontaneously with growth","m":"Lecturer pearl: the cause climbs up the leg as the child grows – foot, then shin, then thigh."},{"t":"INT","q":"What are the features of metatarsus adductus and how is it distinguished from clubfoot?","a":"• **Medial deviation of the forefoot** at the tarsometatarsal joint, **hindfoot normal**\n• Due to **intrauterine restraint**\n• **Bean-shaped** foot with a convex lateral border\n• **Heel bisector** line passes lateral to the 2nd toe (normal: through 2nd/3rd web)\n• Clubfoot differs: **heel in equinus and varus**, rigid","m":"Lecturer pearl: metatarsus adductus = only the front of the foot is turned; clubfoot = the whole foot including the heel."},{"t":"INT","q":"How is metatarsus adductus treated?","a":"• **Most improve** with normal development (by ~4-6 months)\n• Persistent/stiff: **stretching**, **serial casting** or special shoes\n• Rarely surgery: **abductor hallucis release**, **midfoot osteotomy** in the older child","m":"Flexible = leave it; stiff = stretch/cast; old and stiff = operate."},{"t":"INT","q":"How do you diagnose and manage internal tibial torsion?","a":"• Congenital internal rotation of the tibia (reduced intrauterine space)\n• **Negative thigh-foot angle**; **transmalleolar axis internally rotated** with the **patella pointing forward**\n• Hip rotation normal\n• **Most resolve before school age**\n• **Supramalleolar osteotomy** only if it persists into late childhood (~8 years) with functional problems","m":"Patella straight, foot in = the twist is in the shin."},{"t":"INT","q":"What are the features and management of increased femoral anteversion?","a":"• Excess anteversion of the femoral neck with compensatory **internal rotation of the femur**\n• Child **W-sits**; **patellae point inwards** (‘kissing patellae’)\n• **Increased hip internal rotation**, reduced external rotation\n• **Most resolve spontaneously**; shoes/braces do not help\n• **Derotational femoral osteotomy** if it persists past **9-10 years** with functional problems","m":"Kneecaps kiss = the twist is in the thigh."},{"t":"LCP","q":"Define Legg-Calvé-Perthes disease and its vascular basis.","a":"• **Idiopathic avascular necrosis** of the **capital femoral epiphysis** in children\n• Temporary interruption of blood supply → necrosis → **collapse** → **remodelling**\n• Vulnerable supply: **lateral epiphyseal artery** (from the medial circumflex femoral artery)\n• Self-limiting, but the **final head shape** decides outcome","m":"Perthes = a femoral head that dies, crumbles and rebuilds – the shape it rebuilds into is what matters."},{"t":"LCP","q":"What is the epidemiology of Perthes disease?","a":"• ~**1 in 10,000** children\n• Age **4-10 years**\n• **Male : female ≈ 5 : 1**\n• Higher in **urban** areas and **lower socioeconomic** groups; Caucasian > East Asian and African American\n• **~12% bilateral** (usually asynchronous)","m":"Lecturer pearl: symmetrical simultaneous bilateral ‘Perthes’ → think multiple epiphyseal dysplasia or hypothyroidism."},{"t":"LCP","q":"What are the recognised aetiological associations of Perthes disease?","a":"• **Idiopathic** (most)\n• **Trauma**\n• **Steroids**\n• **Vascular/coagulation abnormalities** – **protein C and protein S deficiency**\n• Previous **congenital dislocation of the hip** (DDH treatment)\n• **Smoking exposure** (passive)","m":"Clotting and smoking both starve a fragile end-artery."},{"t":"LCP","q":"How does Perthes disease present and what are the examination findings?","a":"• **Insidious, painless limp** or activity-related pain (relieved by rest) in **hip, groin, thigh or knee**\n• Morning stiffness, muscle weakness, night pain when advanced\n• Exam: **loss of abduction and internal rotation**\n• **Antalgic** gait (acute) → **Trendelenburg** gait (advanced)\n• **Limb length discrepancy**, thigh/gluteal **atrophy**","m":"Perthes child limps more than they complain."},{"t":"LCP","q":"What are the four Waldenström stages of Perthes disease?","a":"• **1. Initial (necrotic)** – 3-6 months: small sclerotic epiphysis, **medial joint space widening**\n• **2. Fragmentation** – 6 months-2 years: revascularisation, osteoclast resorption, **fragmented mottled flattened** head; assess **lateral pillar**\n• **3. Reossification** – ~18 months: new bone replaces necrotic bone\n• **4. Remodelling (healed)** – to maturity; assess shape with **Stulberg**","m":"Die – Crumble – Rebuild – Reshape."},{"t":"LCP","q":"Which plain radiograph views and early signs are seen in Perthes disease?","a":"• Views: **AP pelvis + frog-leg lateral**\n• **Widened medial joint space**\n• Smaller, denser epiphysis\n• **Crescent sign** – subchondral lucent line = **subchondral fracture**\n• **Sclerotic femoral head** (late), then fragmentation and flattening","m":"Crescent sign = a fingernail-shaped crack under the cartilage."},{"t":"LCP","q":"What do MRI, bone scan and arthrogram add in Perthes disease?","a":"• **MRI** – early epiphyseal/physeal changes when X-ray is normal; extent of necrosis\n• **Bone scan** – **reduced uptake (cold area)** = reduced blood flow; shows extent of involvement\n• **Arthrogram** – dynamic view of **coverage and containment** of the head in the acetabulum (and hinge abduction) – used for surgical planning","m":"MRI = early, Scan = cold, Arthrogram = contained?"},{"t":"LCP","q":"Describe the Herring lateral pillar classification of Perthes.","a":"• Assessed in the **fragmentation stage** on AP X-ray\n• **A**: lateral pillar **100% intact** – very good prognosis\n• **B**: **> 50%** height maintained – good to fair\n• **B/C**: ~**50%**, narrow or poorly ossified – variable\n• **C**: **< 50%** height maintained – **poor** prognosis","m":"The lateral pillar holds up the roof – the more it collapses, the worse the head."},{"t":"LCP","q":"What are the key prognostic factors in Perthes disease?","a":"• **Age at onset** – the most important: **> 8 years = poor** (less remodelling time)\n• **Lateral pillar (Herring) C** = poor; **Catterall III-IV** (extent of head involvement) = poor\n• **Loss of containment** / lateral extrusion, persistent loss of ROM\n• Final head shape: **Stulberg classification** (sphericity/congruency) predicts later arthritis","m":"Lecturer pearl: Young and Pillar-intact = good; Old (> 8) and Pillar-collapsed (C) = poor."},{"t":"LCP","q":"What is the non-operative management of Perthes disease?","a":"• Principle: **containment** – keep the soft head deep in the acetabulum while it heals so it moulds round\n• **Activity modification**: restrict weight bearing (crutches/walker), avoid running and jumping\n• **NSAIDs** for pain\n• **Physiotherapy**: restore **abduction and internal rotation** (stretch adductors, flexors, internal rotators)\n• Containment devices: **Petrie casts**, **Scottish Rite abduction brace**","m":"Containment = the acetabulum is the jelly mould for a softened head."},{"t":"LCP","q":"What are the indications and options for surgery in Perthes disease?","a":"• Indications: age **> 8 years at onset**; **Herring B, B/C or C**, **Catterall III-IV** or extensive necrosis on MRI; **progressive lateral extrusion**/loss of containment; persistent loss of abduction/IR despite therapy\n• **Proximal femoral varus osteotomy** – redirects head deeper into the acetabulum\n• **Pelvic osteotomy** – improves coverage\n• **Valgus osteotomy** – salvage for hinge abduction","m":"Varus osteotomy = point the head back into the socket."},{"t":"LCP","q":"What are the complications of Perthes disease?","a":"• **Femoral head deformity** (coxa magna/plana)\n• **Lateral hip subluxation**\n• **Osteochondritis dissecans**\n• **Acetabular dysplasia**, **labral injury**\n• **Premature physeal arrest** → **coxa breva** (short neck, LLD)\n• Long-term: **early osteoarthritis**","m":"A flat head in a round socket wears out early."},{"t":"SCFE","q":"Define slipped capital femoral epiphysis (SCFE) and its direction of displacement.","a":"• Slippage of the proximal femoral **epiphysis** relative to the **metaphysis** through a **weakened physis** (hypertrophic zone)\n• Epiphysis stays in the acetabulum; the **metaphysis moves anteriorly and superiorly** and externally rotates → epiphysis appears **posterior and inferior**\n• **Adolescent** hip disorder\n• Note: slide abbreviates it as ‘SCFU’; correct is **SCFE**","m":"Ice-cream scoop slipping off the back of the cone."},{"t":"SCFE","q":"What is the epidemiology of SCFE?","a":"• ~**10 per 100,000**\n• Age **10-16** (slide: 10-18) – around the pubertal growth spurt\n• **Male : female = 2 : 1**\n• **Obese** children\n• **Left hip** more common\n• **Bilateral 17-50%** (average **~25%**)","m":"Fat, Fertile-age (pubertal), Fellow – and a quarter go both sides."},{"t":"SCFE","q":"What are the risk factors for SCFE, and when should you look for an endocrine cause?","a":"• **Obesity** (raised leptin)\n• **Endocrine**: **hypothyroidism**, **renal osteodystrophy**, growth hormone deficiency/treatment, panhypopituitarism\n• Acetabular and femoral **retroversion**; previous **radiotherapy**\n• **Atypical SCFE** – age < 10 or > 16, **thin/short** child → **TSH, free T4, serum creatinine**","m":"Lecturer pearl: a thin or young slipper has a gland problem until proven otherwise."},{"t":"SCFE","q":"What is the ‘knee pain trap’ in SCFE?","a":"• SCFE often presents with **knee or distal thigh pain** only\n• Referred pain via the **obturator nerve** (supplies both hip and knee)\n• Knee X-rays are normal → diagnosis delayed → slip progresses\n• **Always examine the hip** (and X-ray the pelvis) in an adolescent with knee pain and a limp","m":"Lecturer pearl: knee pain in a teenager = examine the hip."},{"t":"SCFE","q":"What is the Drehmann sign and what other examination findings occur in SCFE?","a":"• **Drehmann sign**: **obligatory external rotation** of the hip on passive flexion\n• Loss of **internal rotation**, abduction and flexion\n• **Externally rotated foot progression angle** (out-toeing)\n• Antalgic or Trendelenburg gait; thigh weakness/atrophy\n• Note: slide spells it ‘Drehnman’; correct is **Drehmann**","m":"Flex the hip and it rolls out – the slipped head can’t rotate inside the socket."},{"t":"SCFE","q":"What are the radiological signs of SCFE?","a":"• Views: **AP pelvis + frog-leg lateral** (lateral shows early slips best)\n• **Trethowan sign**: **Klein line** (along the superior femoral neck) **fails to intersect** the lateral epiphysis\n• **Physeal widening/lucency** (epiphysiolysis), **blurring** of the proximal metaphysis\n• Reduced epiphyseal height\n• MRI: physeal widening and **metaphyseal oedema** (pre-slip)","m":"Klein line misses the head = Trethowan positive. Lecturer pearl: use cross-table lateral if the slip may be unstable."},{"t":"SCFE","q":"What is the Loder classification of SCFE and why does it matter?","a":"• **Stable**: can **weight bear** (with or without crutches) – AVN risk **low (~0-10%)**\n• **Unstable**: **cannot weight bear even with crutches** – AVN risk **high (up to ~50%)**\n• Determines urgency and counselling\n• Both are fixed in situ","m":"Lecturer pearl: Loder asks one question – can the child walk? No = unstable = AVN danger."},{"t":"SCFE","q":"What is the standard management of SCFE and what must never be done?","a":"• Admit, **non-weight bearing**, urgent surgery\n• **Percutaneous in situ fixation** with a **single cannulated screw** (centre of epiphysis, perpendicular to physis) – stable and unstable slips\n• **Never forcefully reduce** the slip – high risk of **AVN**\n• Open epiphyseal reduction and fixation – specialist option for severe slips\n• Residual deformity: **osteochondroplasty**, **proximal femoral osteotomy**","m":"Pin it where it lies – don’t push it back."},{"t":"SCFE","q":"When is prophylactic fixation of the contralateral hip indicated in SCFE?","a":"• **Endocrine or metabolic** cause (hypothyroidism, renal osteodystrophy, GH therapy)\n• **Young age** (< 10 years / open triradiate cartilage) – long remaining growth\n• **Unreliable follow-up**\n• Otherwise: **observe** the other hip and warn the family (~25% bilateral)","m":"Lecturer pearl: pin the other side if the child is Young, Endocrine, or Unreliable."},{"t":"SCFE","q":"What are the complications of SCFE?","a":"• **Avascular necrosis** – unstable slips, forceful reduction\n• **Chondrolysis** – screw penetrating the joint\n• **Femoroacetabular (cam) impingement** from the residual bump → osteochondroplasty\n• **Contralateral slip**\n• Leg length discrepancy, **early osteoarthritis**","m":"AVN from the slip, chondrolysis from the screw, impingement from the bump."},{"t":"DDH","q":"What is developmental dysplasia of the hip (DDH) and which hip is usually affected?","a":"• Spectrum from **acetabular dysplasia** to subluxation to **frank dislocation**\n• Previously **congenital dislocation of the hip**\n• **Most common orthopaedic disorder in newborns**; more common in **females**\n• Usually the **left hip** – in the common **left occiput anterior** position the left hip is held **adducted against the mother’s lumbosacral spine**","m":"LOA → Left hip pressed in (adducted) → Left DDH."},{"t":"DDH","q":"What are the risk factors for DDH?","a":"• The **4 F’s**: **Female**, **First-born**, **Family history**, **Frank breech**\n• **Oligohydramnios**\n• Other packaging associations (Lecturer pearl): torticollis, metatarsus adductus","m":"Lecturer pearl: 4 F’s + ‘O’ for oligohydramnios – a tight womb packs the hip out."},{"t":"DDH","q":"How is DDH classified by hip stability?","a":"• **1.** Reduced and stable but **dysplastic**\n• **2.** Reduced but **dislocatable** – **Barlow positive**\n• **3.** **Dislocated but reducible** – **Ortolani positive**\n• **4.** **Dislocated and irreducible**","m":"Resting state first: reduced → dislocatable (Barlow); dislocated → reducible (Ortolani)."},{"t":"DDH","q":"Barlow vs Ortolani test: what does each do?","a":"• **Barlow**: hip flexed and **adducted**, gentle **posterior push** → a reduced hip **dislocates** (dislocatable hip)\n• **Ortolani**: hip flexed and **abducted**, greater trochanter lifted forwards → a dislocated hip **reduces with a ‘clunk’**\n• Most useful **< 3 months** (before soft-tissue contracture)","m":"Barlow = Bye-bye (pushes it out); Ortolani = Oh-it’s-back-in (clunk)."},{"t":"DDH","q":"What is the Galeazzi test and what is its main limitation?","a":"• Child supine, **hips and knees flexed**, feet together on the couch\n• **Positive**: the knees are at **unequal heights** – the lower knee is on the side of the dislocated (shortened) femur\n• Useful after ~3 months when Barlow/Ortolani become negative\n• Limitation: **falsely negative in bilateral DDH** (both sides equally short)","m":"Lecturer pearl: Galeazzi compares sides – so it is blind when both hips are out."},{"t":"DDH","q":"How does the presentation of DDH change with age?","a":"• **< 3 months**: **Barlow/Ortolani** positive\n• **3-12 months**: **limited hip abduction** (most reliable), **leg-length discrepancy**, **Galeazzi** positive (unequal knee heights, hips/knees flexed – unilateral)\n• **> 1 year (walking)**: **Trendelenburg gait**, **toe walking**, **pelvic obliquity**, **increased lumbar lordosis** (bilateral)\n• Note: slide spells it ‘Galeazi’; correct is **Galeazzi**","m":"Clunk → stiff abduction → limp: the sign moves on as the soft tissues tighten."},{"t":"DDH","q":"What is the role of ultrasound in DDH?","a":"• Imaging of choice **< 4-6 months** (femoral head still cartilage)\n• Indications: **positive examination**, **risk factors** (e.g. breech), **monitoring in Pavlik harness**\n• **Graf alpha angle** (bony roof): **≥ 60° normal**\n• **Beta angle** (cartilage roof): **< 55° normal**","m":"Alpha = bony roof, needs to be big (≥ 60). Beta = cartilage roof, needs to be small (< 55)."},{"t":"DDH","q":"Which radiographic lines are used in DDH and when is X-ray preferred?","a":"• **X-ray once the ossific nucleus appears** (> 4-6 months)\n• **Hilgenreiner line** – horizontal through the triradiate cartilages: head should be **below** it\n• **Perkin line** – vertical from the lateral acetabular edge: head should be **medial** to it (inferomedial quadrant)\n• **Shenton line** – arc from inferior femoral neck to superior pubic ramus: should be **continuous**\n• Lecturer pearl: increased **acetabular index** = shallow socket","m":"H-P-S: Head below H, inside P, Shenton smooth."},{"t":"DDH","q":"How is the Pavlik harness used in DDH?","a":"• Indication: **< 6 months** with a **reducible** hip\n• Position: **90-100° flexion**, **45-60° abduction** (hip in the ‘safe zone’)\n• Worn **24 hours a day for ~12 weeks**, monitored with ultrasound\n• **Stop if not reduced within 3-4 weeks** (risk of posterior acetabular erosion) → closed reduction","m":"Pavlik: under 6 months, check at 3-4 weeks – not in? Take it off."},{"t":"DDH","q":"What are the complications of the Pavlik harness and their causes?","a":"• **Avascular necrosis** of the femoral head – **excessive abduction**\n• **Femoral nerve palsy** – **excessive flexion** (watch for absent quadriceps activity)\n• **Brachial plexus palsy** – shoulder straps","m":"Lecturer pearl: Flexion → Femoral nerve; Abduction → AVN."},{"t":"DDH","q":"How does treatment of DDH change with age?","a":"• **< 6 months**: **Pavlik harness**\n• **6-18 months** or **Pavlik failure**: **closed reduction** (arthrogram ± adductor tenotomy) + **hip spica**\n• **> 18 months**: **open reduction** + spica ± femoral/pelvic osteotomy\n• The later it is found, the bigger the operation","m":"Harness → Closed + spica → Open (+ osteotomy)."},{"t":"BLT","q":"What is Blount disease and what causes it?","a":"• **Acquired genu varum** in children\n• **Excessive compressive force** on the **proximal medial tibial physis/metaphysis** → altered endochondral ossification (medial growth slows – Hueter-Volkmann principle)\n• Risk factors: **obesity**, **early walking**, **African heritage**","m":"Lecturer pearl: heavy toddler walking early on bowed legs squashes the inner tibial growth plate – which bows them more (vicious cycle)."},{"t":"BLT","q":"Infantile vs adolescent Blount disease: what are the key differences?","a":"• **Infantile**: age **2-5 years**, **~50% bilateral**, early walker, large/obese; **Langenskiöld** classification; more severe physeal disturbance; early stages may resolve; **brace or surgery**\n• **Adolescent**: **> 10 years**, **usually unilateral**, obese; no classification; less severe; **progressive**, **surgery only**\n• Note: slide says stages ‘II and IV’ can resolve spontaneously; correct is Langenskiöld **I and II**","m":"Infantile = both legs, brace possible. Adolescent = one leg, operate."},{"t":"BLT","q":"How do you distinguish physiological bowing from Blount disease and rickets?","a":"• **Physiological**: **< 2 years**, symmetrical, gentle curve of **femur and tibia**, **improves** (neutral ~18-24 months, valgus peak 3-4 years)\n• **Blount**: persists/progresses **after 2 years**, abrupt angulation at **proximal tibia**, **lateral thrust**, often asymmetric\n• **Rickets**: generalised – widened wrists, **rachitic rosary**, metaphyseal **cupping and fraying**, raised ALP, low vitamin D","m":"Lecturer pearl: Gentle + young + improving = physiological; sharp + older + worsening = Blount; generalised bone signs = rickets."},{"t":"BLT","q":"What are the clinical features of Blount disease?","a":"• **Genu varum** with **flexion** and **internal rotation**\n• **Internal tibial torsion**, leg length discrepancy\n• **Painless**: no tenderness, effusion or restricted motion\n• **Lateral thrust** of the knee on walking\n• May have a **positive cover-up test** (cover the thigh/femur – the varus is in the tibia)","m":"Lateral thrust = the knee jerks outwards each step as the lateral side gapes."},{"t":"BLT","q":"What X-ray features and measurements are used in Blount disease?","a":"• **AP radiograph of the knee/standing long leg**\n• **Medial beaking** of the metaphysis, **widened irregular medial physis**, irregular ossification, medial slope of epiphysis/metaphysis (**Langenskiöld** stages)\n• **Metaphyseal-diaphyseal (Drennan) angle**: **> 11°** suggests Blount (Lecturer pearl; < 9° physiological)\n• **Tibiofemoral angle**\n• Note: the slide quotes **> 20°** as a **surgical indication**, not the diagnostic cut-off","m":"Drennan > 11 = Blount likely; > 20 = operate."},{"t":"BLT","q":"How is Blount disease treated?","a":"• **Non-operative**: **knee-ankle-foot orthosis (KAFO)** for **Langenskiöld I-II and age < 3 years**, ~2 years\n• **Operative**: **proximal tibial/fibular valgus osteotomy** (cor
